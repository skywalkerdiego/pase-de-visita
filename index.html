<style>
/* Concepto: el expediente clínico de una doctora que estudia en rosa, hecho app para iPhone.
   Tinta frambuesa sobre rubor, títulos en itálica de revista, signos vitales en monitor color vino,
   un "pase" degradado con el conteo al examen y una barra de pestañas flotante de vidrio.
   El color de cada área clínica sigue siendo información. */
:root{
  --bg:#FFF0F6; --bg-2:#FFD9EA; --surface:#FFFFFF; --surface-2:#FFE4EE; --ink:#4A1230; --ink-2:#8B5873; --line:#F6C6D9;
  --accent:#D4237A; --accent-ink:#FFFFFF; --accent-soft:#FFD6E7; --warm:#A0600A; --warm-soft:#FFF1D2;
  --ok:#1B8553; --ok-soft:#DBF4E6; --bad:#C2352B; --bad-soft:#FDE3DE; --glow:rgba(212,35,122,.30);
  --mon-bg:#4A1230; --mon-fg:#FFB8D9; --mon-lab:#DDA3BF;
  --hero-a:#F0559E; --hero-b:#B3125F; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.82);
  --glass:rgba(255,255,255,.74); --glass-bg:rgba(255,240,246,.80);
  --a-mi:#7447CF; --a-ped:#BF5215; --a-gyo:#C2247E; --a-cir:#1F7F99; --a-urg:#C9342D; --a-sp:#55801A;
  --f-display:"Fraunces","Fraunces Variable",Georgia,"Times New Roman",serif;
  --f-body:"Nunito","Nunito Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:20px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#22101B; --bg-2:#3A1630; --surface:#2F1726; --surface-2:#44213A; --ink:#FFE9F3; --ink-2:#DBA9C2; --line:#5E2F4C;
  --accent:#FF7DB8; --accent-ink:#3A0A22; --accent-soft:#5B2042; --warm:#F7C56B; --warm-soft:#463212;
  --ok:#6FD9A0; --ok-soft:#1E3B2D; --bad:#FF8E7E; --bad-soft:#4C1F1C; --glow:rgba(255,125,184,.22);
  --mon-bg:#150810; --mon-fg:#FFB8D9; --mon-lab:#B98AA3;
  --hero-a:#D9388A; --hero-b:#6B1046; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.80);
  --glass:rgba(58,26,46,.78); --glass-bg:rgba(34,16,27,.82);
  --a-mi:#B9A0FF; --a-ped:#FFA467; --a-gyo:#FF8CC6; --a-cir:#72CFE4; --a-urg:#FF8C82; --a-sp:#B8D56C;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#22101B; --bg-2:#3A1630; --surface:#2F1726; --surface-2:#44213A; --ink:#FFE9F3; --ink-2:#DBA9C2; --line:#5E2F4C;
  --accent:#FF7DB8; --accent-ink:#3A0A22; --accent-soft:#5B2042; --warm:#F7C56B; --warm-soft:#463212;
  --ok:#6FD9A0; --ok-soft:#1E3B2D; --bad:#FF8E7E; --bad-soft:#4C1F1C; --glow:rgba(255,125,184,.22);
  --mon-bg:#150810; --mon-fg:#FFB8D9; --mon-lab:#B98AA3;
  --hero-a:#D9388A; --hero-b:#6B1046; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.80);
  --glass:rgba(58,26,46,.78); --glass-bg:rgba(34,16,27,.82);
  --a-mi:#B9A0FF; --a-ped:#FFA467; --a-gyo:#FF8CC6; --a-cir:#72CFE4; --a-urg:#FF8C82; --a-sp:#B8D56C;
  color-scheme:dark }
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 100% 0%,var(--bg-2),transparent 62%),radial-gradient(90% 45% at 0% 100%,var(--bg-2),transparent 58%)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,6.4vw,2.7rem);font-weight:800;font-style:italic;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.06rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.spark{width:.7em;height:.7em;fill:var(--accent);display:inline-block;vertical-align:.12em;margin-left:.18em}
.ti{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ti.fill{fill:currentColor;stroke:none}

/* --- estructura --- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1200px;margin:0 auto}
.top{display:none}
.col{min-width:0}
.first .rail,.first .top{display:none}
.first .app{display:block}
.rail{position:sticky;top:var(--st);align-self:start;display:flex;flex-direction:column;gap:3px;padding:22px 12px 22px 16px;max-height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 10px 16px}
.brand b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.34rem;line-height:1.05}
.brand svg{width:100%;height:24px;display:block}
.brand svg .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.brand svg .ht{fill:var(--accent)}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 14px;border-radius:99px;color:var(--ink-2);white-space:nowrap;font-weight:700}
.nav .lb{flex:1 1 auto;min-width:0}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--glow)}
.nav .n{font-family:var(--f-mono);font-size:.72rem;background:var(--warm-soft);color:var(--warm);border-radius:99px;padding:1px 7px;font-weight:600}
.nav .sh{display:none}
.nav.mo{display:none}
.snd{margin-top:10px;align-self:flex-start}
main{min-width:0;padding-block:26px 72px;padding-inline:clamp(16px,3.2vw,40px);display:flex;flex-direction:column;gap:26px}
main:focus{outline:none}
.dock{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kbd{font-size:.875rem;color:var(--ink-2)}
.mob{display:none}

@media (max-width:860px){
  html{font-size:106.25%}
  .app{display:block}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:8;padding:calc(var(--st) + 8px) 16px 8px;background:var(--glass-bg);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  .tbrand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;min-height:40px}
  .tbrand svg{width:26px;height:26px;fill:var(--accent)}
  .tbrand b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:1.16rem;letter-spacing:-.01em}
  .tact{display:flex;align-items:center;gap:6px}
  .streak{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-weight:600;font-size:.86rem;color:var(--warm);background:var(--warm-soft);border-radius:99px;padding:5px 10px 5px 7px}
  .streak svg{width:16px;height:16px;fill:currentColor}
  .icb{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
  .icb[aria-pressed="false"]{color:var(--ink-2)}
  .rail{position:fixed;left:10px;right:10px;top:auto;bottom:calc(8px + var(--sb));flex-direction:row;align-items:stretch;gap:2px;padding:5px;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(22px);backdrop-filter:saturate(1.8) blur(22px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:26px;z-index:10;max-height:none;overflow:visible;box-shadow:0 14px 34px -14px var(--glow),0 2px 8px -4px rgba(74,18,48,.18)}
  .brand,.nav.sec,.rail .snd{display:none}
  .nav,.nav.mo{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:1px;padding:7px 2px 6px;font-size:.66rem;font-weight:800;border-radius:21px;text-align:center}
  .nav .lb{flex:none}
  .nav .lg{display:none} .nav .sh{display:inline}
  .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .nav[aria-current="page"] .ti{stroke-width:2.2}
  .nav .n{position:absolute;top:2px;left:calc(50% + 5px);font-size:.6rem;padding:0 5px;min-width:17px;text-align:center;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--surface)}
  main{padding:16px 16px calc(104px + var(--sb));gap:22px}
  .focus .top,.focus .rail{display:none}
  .focus main{padding-top:calc(var(--st) + 14px);padding-bottom:calc(104px + var(--sb))}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:9;flex-wrap:nowrap;padding:10px 16px calc(10px + var(--sb));background:var(--glass-bg);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
  .dock>.btn{flex:1 1 0;min-width:0;min-height:50px}
  .dock>.btn.fit,.dock>.chip{flex:0 0 auto}
  .mob{display:initial}
  .kbd,.desk{display:none}
  .fc{min-height:min(50vh,430px)}
}
@media (hover:none){.kbd{display:none}}

/* --- piezas --- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 0;min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:0 16px 32px -26px var(--glow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:800;min-height:44px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 20px -12px var(--glow)}
.btn.sm{min-height:38px;padding:5px 14px;font-size:.9rem}
.btn.big{min-height:54px;font-size:1.08rem;padding:12px 26px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ti{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;border-radius:99px;padding:3px 11px;background:var(--surface-2);color:var(--ink);border:0;white-space:nowrap}
.chip.area{background:transparent;border:1.5px solid var(--c);color:var(--c)}
.chip.area::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.warn{background:var(--warm-soft);color:var(--warm)}
button.chip{min-height:38px;padding:5px 14px;font-size:.88rem;border:1.5px solid var(--line);background:var(--surface);white-space:normal;text-align:left}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.c-mi{--c:var(--a-mi)} .c-ped{--c:var(--a-ped)} .c-gyo{--c:var(--a-gyo)} .c-cir{--c:var(--a-cir)} .c-urg{--c:var(--a-urg)} .c-sp{--c:var(--a-sp)}
.note{background:var(--surface-2);border-radius:var(--r);padding:14px 16px}
.note.warm{background:var(--warm-soft)}
.bar{height:11px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{flex:none}
.scroller>button.chip{white-space:nowrap}
@media (min-width:861px){.scroller{flex-wrap:wrap;margin:0;padding:0;overflow:visible}}
.volver{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 10px 6px 0;min-height:40px;color:var(--accent);font-weight:800}
.volver .ti{width:18px;height:18px;stroke-width:2.4}

/* --- movimiento --- */
@media (prefers-reduced-motion:no-preference){
  .btn,.op,.mb,.tile,.fc,.nav,.item,.gt{transition:transform .09s ease,background-color .15s ease,border-color .15s ease}
  .btn:active,.op:not([disabled]):active,.mb:active,.tile:active,.nav:active,.gt:active{transform:scale(.96)}
  .enter>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.04s} .enter>*:nth-child(3){animation-delay:.08s} .enter>*:nth-child(4){animation-delay:.12s} .enter>*:nth-child(n+5){animation-delay:.16s}
  .fresh .op.ok{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
  .fresh .op.bad{animation:shake .34s ease}
  .fresh .verd{animation:rise .3s ease both}
  .fc.back{animation:flip .26s ease-out}
  .ring .pr{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
  #toast:not([hidden]){animation:rise .24s ease both}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.025)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes flip{from{transform:rotateX(70deg);opacity:.4}to{transform:none;opacity:1}}

/* --- Hoy --- */
.hello{display:flex;flex-direction:column;gap:6px}
.notita{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.08rem;color:var(--accent);max-width:46ch}
.pass{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 16px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a),var(--hero-b));box-shadow:0 22px 40px -22px var(--glow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px;align-items:center}
.pass::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 68%);pointer-events:none}
.pass .ecg{flex:1 1 40px;min-width:30px;height:22px;opacity:.7}
.pass .ecg path{fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.pass .pl{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.pass .pk{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-dim)}
.pass .pn{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:clamp(3.2rem,15vw,4.4rem);line-height:.92;letter-spacing:-.02em}
.pass .pn small{font-family:var(--f-body);font-style:normal;font-weight:800;font-size:1.05rem;letter-spacing:0;margin-left:6px}
.pass .ps{font-size:.86rem;color:var(--hero-dim)}
.pass .pf{position:relative;grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px dashed rgba(255,255,255,.4);padding-top:12px;font-size:.88rem;font-weight:700}
.pass a,.pass .link{color:#fff}
.ring{position:relative;width:84px;height:84px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.26)}
.ring .pr{stroke:#fff}
.ring span{position:relative;font-family:var(--f-mono);font-size:.82rem;font-weight:500;color:var(--hero-dim)}
.ring b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:1.7rem;color:#fff}
.hearts{display:flex;gap:5px;align-items:center}
.hearts svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9}
.hearts svg.on{fill:currentColor}
.orden{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 0;border-top:1px dashed var(--line)}
.orden:first-of-type{border-top:0}
.orden .num{font-family:var(--f-mono);font-weight:600;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);font-size:.85rem}
.orden .num .ti{width:16px;height:16px;stroke-width:2.6}
.orden.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.orden.done h3{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-2)}
.orden .btn{min-width:84px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 28px}
.arow{display:grid;gap:5px}
.bars{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:auto var(--h) auto;gap:4px 6px;text-align:center;justify-items:center}
.bars b{font-family:var(--f-mono);font-size:.74rem;font-weight:500;align-self:end;min-height:1.1em}
.bars i{display:block;align-self:end;width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:var(--accent)}
.bars i.zero{background:var(--line)}
.bars i.new{background:var(--ink-2)}
.bars span{font-size:.7rem;color:var(--ink-2);line-height:1.2}
.inst{border:1.5px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 32px -24px var(--glow)}
.inst ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.inst li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.inst li>span:first-child{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* --- Bienvenida --- */
.welcome{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:max(4vh,8px)}
.welcome .logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;box-shadow:0 18px 30px -16px var(--glow)}
.welcome .logo svg{width:44px;height:44px;fill:#fff}
.welcome .lead{font-size:1.1rem}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feat li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.feat li>span:first-child{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* --- Más --- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gt{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 16px;min-height:124px;box-shadow:0 16px 30px -26px var(--glow)}
.gt>span:first-child{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:2px}
.gt b{font-size:1.02rem;line-height:1.2}
.gt .small{line-height:1.3}
.gt .chip{position:absolute;top:12px;right:12px}

/* --- Stickers --- */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--surface)}
.st svg{width:46px;height:46px;fill:var(--line);stroke:var(--line);stroke-width:0}
.st b{font-size:.95rem;line-height:1.2}
.st span{font-size:.78rem;color:var(--ink-2);line-height:1.25}
.st.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.st.on svg{fill:var(--accent);stroke:var(--accent)}
.stmini{display:flex;gap:6px;flex-wrap:wrap}
.stmini svg{width:26px;height:26px;fill:var(--line)}
.stmini svg.on{fill:var(--accent)}

/* --- Temas --- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:86px;background:color-mix(in srgb,var(--ok) calc(var(--m,0)*1%),var(--surface));justify-content:space-between}
.tile.nd{border-style:dashed;background:var(--surface)}
.tile b{font-size:.95rem;line-height:1.2}
.tile span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}
.areahead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--c);padding-bottom:6px}
.areahead h2{color:var(--c)}

/* --- Casos --- */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:13px 4px;border:0;border-top:1px dashed var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
@media (max-width:560px){.item.wide{grid-template-columns:minmax(0,1fr)} .item.wide .meta{flex-direction:row;align-items:center!important;justify-content:space-between;margin-top:4px}}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-2)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.bad{background:var(--bad);border-color:var(--bad)}
.play{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:minmax(0,1fr)}}
.vin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 32px -26px var(--glow)}
@media (min-width:961px){.vin.pin{position:sticky;top:calc(var(--st) + 16px)}}
.ficha{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.vin .tx{font-size:1.06rem;line-height:1.55;max-width:66ch}
.vit{display:flex;flex-wrap:wrap;gap:6px}
.vit span{background:var(--mon-bg);border-radius:12px;padding:6px 11px;display:flex;flex-direction:column;min-width:64px;font-family:var(--f-mono)}
.vit small{font-size:.64rem;letter-spacing:.08em;color:var(--mon-lab)}
.vit b{font-size:1.02rem;font-weight:600;color:var(--mon-fg);font-variant-numeric:tabular-nums}
.labs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 18px;font-size:.92rem}
.labs div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.labs b{font-family:var(--f-mono);font-weight:500;text-align:right}
.voc{font-size:.88rem;color:var(--ink-2)}
.q{font-size:1.2rem;font-family:var(--f-body);font-weight:800;line-height:1.3;letter-spacing:0;font-style:normal}
.ops{display:flex;flex-direction:column;gap:9px}
.op{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 14px;width:100%;font-size:1.02rem;-webkit-user-select:text;user-select:text}
.op .k{font-family:var(--f-mono);font-weight:600;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);font-size:.85rem}
.op[disabled]{cursor:default;color:inherit;opacity:1}
.op.sel{border-color:var(--accent);background:var(--accent-soft)} .op.sel .k{background:var(--accent);color:var(--accent-ink)}
.op.ok{border-color:var(--ok);background:var(--ok-soft)} .op.ok .k{background:var(--ok);color:var(--surface)}
.op.bad{border-color:var(--bad);background:var(--bad-soft)} .op.bad .k{background:var(--bad);color:var(--surface)}
.op .why{grid-column:2;font-size:.92rem;color:var(--ink-2)}
.op.ok .why,.op.bad .why{color:var(--ink)}
.verd{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.4rem}
.verd.ok{color:var(--ok)} .verd.bad{color:var(--bad)}
.perla{border:1.5px dashed var(--warm);border-radius:var(--r);padding:12px 14px;background:var(--warm-soft)}
.perla b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--warm);display:block}
.ia-out{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:.96rem}
.ia-only{display:none}
.ia .ia-only{display:flex}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:8px}
.score{display:flex;align-items:center;gap:16px}
.score .ring{width:104px;height:104px;flex:none}
.score .ring .tr{stroke:var(--surface-2)} .score .ring .pr{stroke:var(--accent)}
.score .ring b{color:var(--accent);font-size:1.9rem}
.score .ring span{color:var(--ink-2)}

/* --- Tarjetas --- */
.fc{width:100%;min-height:min(46vh,340px);display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;border:1px solid var(--line);border-radius:28px;padding:30px 22px;background:var(--surface);font-size:1.12rem;box-shadow:0 22px 40px -28px var(--glow),0 3px 0 0 var(--surface-2),0 6px 0 -1px var(--line)}
.fc.back{background:var(--accent-soft);border-color:var(--accent)}
.fc .hint{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.fc .f{font-family:var(--f-display);font-weight:600;font-size:1.36rem;line-height:1.25;text-wrap:balance}
.fc .b{max-width:60ch;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1}
.grades .btn{flex-direction:column;gap:2px;padding:9px 4px;border-radius:18px;min-height:56px}
.grades small{font-weight:400;font-size:.74rem;color:var(--ink-2)}
.g-no{border-color:var(--bad);background:var(--bad-soft)} .g-si{border-color:var(--ok);background:var(--ok-soft)}

/* --- Visual --- */
.flow{display:flex;flex-direction:column}
.node{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.node.past{opacity:.78}
.node.d{border-color:var(--accent)} .node.f{border-color:var(--ok);background:var(--ok-soft)}
.node .tag{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.node .btn{white-space:normal;text-align:left;border-radius:16px;justify-content:flex-start}
.conn{display:flex;align-items:center;gap:10px;padding:5px 0 5px 22px;min-height:26px}
.conn::before{content:"";width:2px;align-self:stretch;min-height:22px;background:var(--line)}
.conn .chip{white-space:normal}
.tree{font-size:.92rem;padding-left:0;margin:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tree ul{list-style:none;padding-left:14px;border-left:2px solid var(--line);margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.tree .opt{font-weight:800;color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
thead th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
tbody th{font-weight:800;min-width:112px;position:sticky;left:0;background:var(--surface);box-shadow:1px 0 0 var(--line)}
tr:last-child td,tr:last-child th{border-bottom:0}
.cell{border:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);color:transparent;border-radius:8px;padding:4px 6px;width:100%;text-align:left;min-height:40px;user-select:none}
.cell.rev{background:transparent;color:inherit;padding:0;cursor:default;-webkit-user-select:text;user-select:text}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.match .col2{display:flex;flex-direction:column;gap:8px}
.mb{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;min-height:58px;width:100%;font-size:.95rem;line-height:1.25}
.mb.sel{border-color:var(--accent);background:var(--accent-soft)}
.mb.done{border-color:var(--ok);background:var(--ok-soft);opacity:.6;cursor:default}
.mb.miss{border-color:var(--bad);background:var(--bad-soft)}
.dotgrid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;max-width:380px}
.dotgrid i{aspect-ratio:1;border-radius:50%;border:1.5px solid transparent}
.d-vp{background:var(--accent)} .d-fn{border-color:var(--accent)!important;background:transparent}
.d-fp{background:var(--warm)} .d-vn{border-color:var(--line)!important;background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:50%;border:1.5px solid transparent;display:inline-block}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.sliders label{display:grid;gap:4px;font-weight:800}
.sliders input{width:100%;accent-color:var(--accent);min-height:34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border-top:2px solid var(--accent);padding-top:8px}
.kpi b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.8rem;display:block;line-height:1.1}

/* --- Simulacro --- */
.simbar{position:sticky;top:0;z-index:4;margin:calc(-1*(var(--st) + 14px)) -16px 0;padding:calc(var(--st) + 10px) 16px 10px;background:var(--glass-bg);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
@media (min-width:861px){.simbar{margin:0;padding:10px 0;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
.clock{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.qn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;font-family:var(--f-mono);font-size:.85rem}
.qn.ans{background:var(--accent-soft);border-color:var(--accent)}
.qn.flag{box-shadow:inset 0 -4px 0 var(--warm)}
.qn.cur{outline:2.5px solid var(--ink);outline-offset:1px}
details{border-top:1px dashed var(--line);padding:12px 0}
details summary{cursor:pointer;font-weight:800}
details>*:not(summary){margin-top:10px}

/* --- Bitácora y plan --- */
.hbar{display:grid;grid-template-columns:minmax(104px,220px) minmax(0,1fr) minmax(46px,auto);gap:10px;align-items:center;font-size:.92rem}
.hbar>:last-child{text-align:right;white-space:nowrap}
.err{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px dashed var(--line)}
.err:first-child{border-top:0}
.field{display:grid;gap:4px;font-weight:800;font-size:.92rem}
.field input,.field select,textarea,.err input[type=text]{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-weight:400;width:100%;min-height:46px;font-size:max(16px,1rem);-webkit-appearance:none;appearance:none}
.field input[type=date]{display:block;text-align:left}
textarea{min-height:92px;font-family:var(--f-mono);font-size:max(16px,.8rem)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px}
.fases{display:flex;gap:4px;min-height:14px}
.fases i{display:block;height:14px;border-radius:99px;min-width:6px}
.fase{display:grid;grid-template-columns:16px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px dashed var(--line)}
.fase:first-of-type{border-top:0}
.fase i{width:14px;height:14px;border-radius:50%;margin-top:5px}
.f1{background:var(--a-mi)} .f2{background:var(--accent)} .f3{background:var(--warm)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px}
.facts div{border-top:2px solid var(--accent);padding-top:8px}
.facts b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;font-style:italic;display:block}
ol.metodo{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;max-width:70ch}
.saved{display:flex;align-items:center;gap:10px}
.saved>span:first-child{width:38px;height:38px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
#toast{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(24px + var(--sb));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:20px;font-weight:800;z-index:40;width:fit-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
@media (max-width:860px){#toast{bottom:calc(96px + var(--sb))}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* efectos de puntero solo donde hay puntero: en el teléfono no se quedan "pegados" */
@media (hover:hover) and (min-width:861px){
  .nav:hover{background:var(--surface-2);color:var(--ink)}
  .nav[aria-current="page"]:hover{background:var(--accent);color:var(--accent-ink)}
}
@media (hover:hover){
  .btn:hover,.tile:hover,.gt:hover,.op:not([disabled]):hover{border-color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.07)}
  button.item:hover{background:var(--surface-2)}
}

<noscript><p style="padding:24px;font:16px system-ui">Pase de Visita necesita JavaScript. Actívalo en los ajustes de tu navegador.</p></noscript>

<script>
(function(){ "use strict";
/* ===== Datos: áreas y temas ===== */
const AREAS = {

};

const TEMAS = {
  // Medicina Interna

  tb: { n: "Tuberculosis pulmonar", a: "MI" },
  tiroides: { n: "Enfermedades tiroideas", a: "MI" },
  anemias: { n: "Anemias", a: "MI" },

  asma: { n: "Asma", a: "MI" },

  cervicovaginitis: { n: "Cervicovaginitis", a: "GYO" },

  aborto: { n: "Aborto", a: "GYO" },

["erc", "Estadios de enfermedad renal crónica por filtrado (KDIGO)", "G1 ≥90 · G2 60 a 89 · G3a 45 a 59 · G3b 30 a 44 · G4 15 a 29 · G5 <15 ml/min/1.73 m². Debe persistir 3 meses o más."],
["erc", "Causa más frecuente de enfermedad renal crónica en México", "Nefropatía diabética; después, la nefroangioesclerosis hipertensiva."],
["evc", "Ventana para trombólisis IV en el evento vascular cerebral isquémico", "Alteplasa hasta 4.5 horas del inicio, con tomografía sin hemorragia y presión menor de 185/110 mmHg."],
["meningitis", "Líquido cefalorraquídeo en la meningitis bacteriana", "Turbio, con muchas células de predominio polimorfonuclear, glucosa baja (menor de 40 mg/dL) y proteínas altas."],
["meningitis", "Tratamiento empírico de la meningitis bacteriana del adulto", "Ceftriaxona más vancomicina; se agrega ampicilina en mayores de 50 años, embarazo o inmunosupresión (Listeria). Dexametasona antes o junto con la primera dosis."],
["cirrosis", "Diagnóstico de peritonitis bacteriana espontánea", "250 polimorfonucleares o más por mm³ en el líquido de ascitis. Tratamiento: cefalosporina de tercera generación y albúmina."],
["cirrosis", "Gradiente de albúmina entre suero y ascitis", "1.1 g/dL o más: hipertensión portal (cirrosis, insuficiencia cardiaca). Menos de 1.1: carcinomatosis, tuberculosis, pancreatitis."],
["reuma", "Artritis reumatoide: anticuerpo más específico y fármaco de primera línea", "Anticuerpos antipéptido cíclico citrulinado. Fármaco modificador de elección: metotrexato, con ácido fólico."],
["reuma", "Gota: cristales y manejo del ataque agudo", "Cristales de urato monosódico en forma de aguja con birrefringencia negativa. Ataque agudo: antiinflamatorio, colchicina o esteroide. No se inicia alopurinol durante el ataque."],
["reuma", "Lupus: anticuerpos", "Antinucleares: los más sensibles (tamizaje). Anti-DNA de doble cadena y anti-Sm: los más específicos; el anti-DNA se relaciona con nefritis y actividad."],
["vih", "Profilaxis con CD4 menores de 200 células/mm³", "Trimetoprim con sulfametoxazol contra Pneumocystis jirovecii; con menos de 100 también protege contra toxoplasma."],
["dengue", "Signos de alarma en dengue", "Dolor abdominal intenso, vómito persistente, sangrado de mucosas, letargo o irritabilidad, acumulación de líquidos, hepatomegalia, y aumento del hematocrito con caída rápida de plaquetas."],
["dengue", "Analgésico en dengue", "Solo paracetamol. Se evitan los antiinflamatorios no esteroideos y el ácido acetilsalicílico por riesgo de sangrado."],
["electrolitos", "Hiperkalemia con cambios en el electrocardiograma: orden de tratamiento", "1) Gluconato de calcio: estabiliza la membrana. 2) Insulina con glucosa, salbutamol, bicarbonato: redistribuyen. 3) Diurético, resinas o hemodiálisis: eliminan."],
["electrolitos", "Corrección de la hiponatremia: límite de seguridad", "No más de 8 a 10 mEq/L en 24 horas, para evitar la desmielinización osmótica."],
["tep", "Tromboembolia pulmonar: hallazgo más frecuente en el electrocardiograma y estudio de elección", "Taquicardia sinusal (el patrón S1Q3T3 es clásico pero poco frecuente). Estudio de elección: angiotomografía pulmonar."],
["icc", "Fármacos que reducen la mortalidad en insuficiencia cardiaca con fracción de expulsión reducida", "IECA, ARA II o sacubitrilo-valsartán; betabloqueadores; antagonistas de aldosterona; inhibidores de SGLT2. Los diuréticos y la digoxina solo mejoran síntomas."],
["asma", "Crisis asmática: tratamiento inicial", "Salbutamol inhalado en dosis repetidas, oxígeno y esteroide sistémico temprano. En crisis moderada a grave se agrega bromuro de ipratropio."],

// --- Pediatría
["deshidratacion", "Plan A de hidratación: el ABC", "Alimentación continua, Bebidas abundantes (Vida Suero Oral: 75 ml en menores de un año y 150 ml en mayores, después de cada evacuación) y Consulta oportuna ante signos de alarma."],
["deshidratacion", "Plan B de hidratación", "Vida Suero Oral, 100 ml/kg en 4 horas, fraccionado cada 30 minutos, en la unidad de salud y con revaloración al terminar."],
["deshidratacion", "Plan C de hidratación", "Choque: solución Hartmann o salina 0.9% intravenosa, 50 ml/kg la primera hora y 25 ml/kg en la segunda y la tercera. Vía oral en cuanto pueda beber."],
["deshidratacion", "Agente más frecuente de diarrea aguda grave en lactantes", "Rotavirus. El zinc reduce la duración y la gravedad del episodio."],
["bronquiolitis", "Bronquiolitis: definición y agente", "Primer episodio de sibilancias en un menor de 2 años, después de un catarro. Virus sincicial respiratorio. El manejo es de soporte."],
["crup", "Crup contra epiglotitis", "Crup: parainfluenza, tos perruna, estridor, signo de la aguja; dexametasona. Epiglotitis: Haemophilus influenzae b, salivación, posición en trípode, signo del pulgar; asegurar la vía aérea sin explorar la faringe."],
["ictericia_rn", "Datos de ictericia neonatal patológica", "Aparece en las primeras 24 horas, aumenta más de 5 mg/dL por día, bilirrubina directa mayor de 2 mg/dL o duración mayor de 2 semanas."],
["ictericia_rn", "Atresia de vías biliares: sospecha y tiempo quirúrgico", "Ictericia con heces claras y orina oscura después de la segunda semana, con bilirrubina directa alta. Portoenterostomía de Kasai, idealmente antes de los 60 días de vida."],
["reanimacion_rn", "Reanimación neonatal: umbrales de frecuencia cardiaca", "Menos de 100 o apnea: ventilación con presión positiva. Menos de 60 tras 30 segundos de ventilación efectiva: compresiones 3:1 con oxígeno al 100%. Si persiste: adrenalina."],
["reanimacion_rn", "Escala de Apgar: parámetros", "Apariencia (color), Pulso, Gesticulación (respuesta a estímulos), Actividad (tono) y Respiración. De 0 a 2 puntos cada uno, al minuto y a los 5 minutos."],
["reanimacion_rn", "Silverman-Andersen: qué evalúa", "Dificultad respiratoria del recién nacido: disociación toracoabdominal, tiraje intercostal, retracción xifoidea, aleteo nasal y quejido. Cero es normal; a mayor puntaje, mayor gravedad."],
["abdomen_ped", "Estenosis hipertrófica de píloro: cuadro y alteración ácido-base", "Entre 3 y 6 semanas de vida, vómito no biliar en proyectil y oliva pilórica. Alcalosis metabólica hipoclorémica e hipokalémica. Ultrasonido; piloromiotomía."],
["abdomen_ped", "Invaginación intestinal: tríada y tratamiento", "Dolor cólico intermitente, masa en salchicha y evacuaciones en jalea de grosella. Ultrasonido con signo de la diana. Enema reductor si no hay perforación ni peritonitis."],
["exantemas", "Sarampión: datos clave", "Tos, coriza y conjuntivitis; manchas de Koplik; exantema maculopapular que desciende desde la cabeza. Vitamina A. Notificación inmediata."],
["exantemas", "Exantema súbito (roséola)", "Herpes virus 6. Fiebre alta por 3 días en un lactante; el exantema aparece cuando la fiebre cede."],
["exantemas", "Eritema infeccioso (quinta enfermedad)", "Parvovirus B19. Mejillas 'abofeteadas' y después exantema en encaje. Riesgo de crisis aplásica en anemias hemolíticas y de hidrops fetal en el embarazo."],
["exantemas", "Escarlatina", "Streptococcus pyogenes. Lengua en fresa, piel áspera como lija, líneas de Pastia y palidez alrededor de la boca. Penicilina."],
["exantemas", "Enfermedad de Kawasaki: criterios", "Fiebre de 5 días o más y 4 de 5: conjuntivitis bilateral no purulenta, cambios en labios y boca, exantema, cambios en manos y pies, adenopatía cervical de 1.5 cm o más. Inmunoglobulina y ácido acetilsalicílico; ecocardiograma."],
["crisis_febriles", "Crisis febril simple: criterios", "De 6 meses a 5 años, generalizada, menor de 15 minutos, sin repetirse en 24 horas y sin déficit posterior. No requiere electroencefalograma ni imagen."],
["sdr_rn", "Enfermedad de membrana hialina: radiografía y tratamiento", "Prematuro. Vidrio esmerilado, broncograma aéreo y poco volumen pulmonar. Surfactante y CPAP. Se previene con esteroides prenatales."],
["sdr_rn", "Taquipnea transitoria del recién nacido", "Recién nacido de término o casi, por cesárea sin trabajo de parto. Líquido en cisuras e hiperinsuflación. Se resuelve en 24 a 72 horas con oxígeno."],
["desarrollo", "Hitos del desarrollo motor grueso", "Sostén cefálico a los 3 meses · se sienta sin apoyo a los 6 a 7 meses · gatea a los 9 meses · camina entre los 12 y 15 meses."],
["desarrollo", "Hitos: sonrisa social, pinza fina y lenguaje", "Sonrisa social a los 2 meses · pinza fina a los 9 a 10 meses · primeras palabras con sentido a los 12 meses · frases de dos palabras a los 24 meses."],
["ivas_ped", "Otitis media aguda: agente y tratamiento", "Streptococcus pneumoniae, seguido de Haemophilus influenzae no tipificable. Amoxicilina a dosis altas: 80 a 90 mg/kg/día."],
["ivas_ped", "Faringoamigdalitis estreptocócica: criterios de Centor y tratamiento", "Fiebre, exudado amigdalino, adenopatía cervical anterior dolorosa y ausencia de tos. Penicilina, para prevenir la fiebre reumática."],
["neumonia_ped", "Taquipnea según la edad (OMS)", "Menor de 2 meses: 60 o más por minuto · de 2 a 11 meses: 50 o más · de 1 a 5 años: 40 o más. Es el signo más sensible de neumonía en niños."],
["desnutricion", "Kwashiorkor contra marasmo", "Kwashiorkor: déficit de proteínas, con edema, hígado grande y lesiones de piel. Marasmo: déficit calórico total, emaciación sin edema y cara de anciano."],
["desnutricion", "Clasificación de Gómez (peso para la edad)", "Déficit de 10 a 24%: leve · de 25 a 39%: moderada · de 40% o más: grave."],
["cadera", "Displasia del desarrollo de la cadera: tamizaje e imagen", "Maniobras de Ortolani (reduce) y Barlow (luxa). Ultrasonido antes de los 4 meses y radiografía después. Arnés de Pavlik en menores de 6 meses."],

// --- Ginecología y Obstetricia
["preeclampsia", "Preeclampsia: definición", "Después de las 20 semanas: presión de 140/90 o más con proteinuria de 300 mg o más en 24 horas, o con daño a órgano blanco."],
["preeclampsia", "Datos de severidad en la preeclampsia", "Presión de 160/110 o más, plaquetas menores de 100,000, creatinina mayor de 1.1 mg/dL, transaminasas al doble, edema pulmonar, dolor de cabeza o alteraciones visuales persistentes, dolor en epigastrio."],
["preeclampsia", "Sulfato de magnesio: esquema, toxicidad y antídoto", "Zuspan: 4 g IV de impregnación y 1 g por hora. Se vigila el reflejo patelar (lo primero que se pierde), la respiración y la diuresis. Antídoto: gluconato de calcio 1 g IV."],
["preeclampsia", "Síndrome HELLP", "Hemólisis (deshidrogenasa láctica alta, esquistocitos), Enzimas hepáticas Elevadas y Plaquetas bajas (Low Platelets). Se interrumpe el embarazo."],
["preeclampsia", "Prevención de preeclampsia en mujeres de alto riesgo", "Ácido acetilsalicílico a dosis baja (100 a 150 mg al día), iniciado antes de las 16 semanas."],
["hpp", "Hemorragia posparto: las 4 T", "Tono (atonía: la más frecuente, cerca de 70%), Trauma (desgarros, ruptura), Tejido (restos, acretismo) y Trombina (coagulopatía)."],
["hpp", "Manejo activo del tercer periodo del parto", "Oxitocina 10 UI al nacer el bebé, tracción controlada del cordón y verificación del tono uterino."],
["hpp", "Uterotónico contraindicado en hipertensión", "Ergonovina: es vasoconstrictor. En asmáticas se evita el carboprost."],
["ectopico", "Embarazo ectópico: sitio más frecuente y factores de riesgo", "La ampolla de la trompa uterina. Factores: enfermedad pélvica inflamatoria, ectópico previo y cirugía de trompas."],
["ectopico", "Criterios para metotrexato en el embarazo ectópico", "Estabilidad hemodinámica, sin ruptura, masa menor de 3.5 a 4 cm, sin latido embrionario, β-hCG menor de 5,000 mUI/mL y posibilidad de seguimiento."],
["sangrado3t", "Placenta previa contra desprendimiento prematuro", "Previa: sangrado rojo brillante, indoloro, útero relajado; no se hace tacto. Desprendimiento: dolor, útero duro, sangrado oscuro que puede estar oculto y compromiso fetal; se asocia a hipertensión."],
["dmg", "Diagnóstico de diabetes gestacional con curva de 75 g", "Entre las 24 y 28 semanas. Basta un valor: ayuno de 92 o más, 180 o más a la hora, o 153 o más a las 2 horas."],
["dmg", "Metas de glucosa en la diabetes gestacional", "Ayuno de 95 mg/dL o menos; 140 o menos una hora después de comer; 120 o menos a las 2 horas. Si no se logran con dieta y ejercicio: insulina."],
["prenatal", "Control prenatal según la NOM-007", "Mínimo 5 consultas, iniciando de preferencia en las primeras 8 semanas."],
["prenatal", "Ácido fólico: dosis", "0.4 mg al día desde 3 meses antes de la concepción y durante el primer trimestre. 4 mg al día si hay antecedente de defecto del tubo neural."],
["cacu", "Cáncer cervicouterino: agente y tipos", "Virus del papiloma humano de alto riesgo, sobre todo los tipos 16 y 18. Los tipos 6 y 11 causan condilomas."],
["cacu", "Tamizaje de cáncer cervicouterino (NOM-014)", "Citología cervical de los 25 a los 64 años; después de dos citologías anuales negativas, cada 3 años. Con resultado anormal: colposcopia con biopsia dirigida."],
["mama", "Tamizaje de cáncer de mama (NOM-041)", "Autoexploración mensual desde los 20 años, exploración clínica anual desde los 25 y mastografía cada 2 años de los 40 a los 69."],
["mama", "BI-RADS: conducta", "0: estudios adicionales · 1 y 2: negativo o benigno · 3: probablemente benigno, control a 6 meses · 4 y 5: sospechoso, biopsia · 6: malignidad ya confirmada."],
["cervicovaginitis", "Criterios de Amsel para vaginosis bacteriana", "Tres de cuatro: flujo homogéneo grisáceo, pH mayor de 4.5, olor a pescado al agregar hidróxido de potasio y células clave."],
["cervicovaginitis", "Tricomoniasis: datos y tratamiento", "Flujo amarillo verdoso y espumoso, cérvix en fresa, pH mayor de 4.5 y protozoo flagelado móvil. Metronidazol, y se trata a la pareja."],
["sop", "Ovario poliquístico: criterios de Rotterdam", "Dos de tres: oligoovulación o anovulación, hiperandrogenismo clínico o bioquímico, y ovarios poliquísticos por ultrasonido, tras excluir otras causas."],
["aborto", "Amenaza de aborto contra aborto inevitable", "Amenaza: sangrado con cérvix cerrado y embarazo viable. Inevitable: cérvix dilatado o ruptura de membranas, aún sin expulsión."],
["rpm", "Esquema de maduración pulmonar fetal", "Entre las 24 y 34 semanas: betametasona 12 mg intramuscular cada 24 horas, 2 dosis; o dexametasona 6 mg cada 12 horas, 4 dosis."],
["rpm", "Ruptura prematura de membranas: confirmación", "Salida de líquido por el cérvix en la especuloscopia, cristalografía con imagen en helecho y prueba de nitrazina (pH alcalino)."],
["climaterio", "Terapia hormonal en la menopausia: indicación y contraindicaciones", "Para síntomas vasomotores moderados a graves. Contraindicada con cáncer de mama o endometrio, sangrado uterino sin diagnóstico, trombosis o hepatopatía activa."],
["rh", "Profilaxis de isoinmunización Rh", "Madre Rh negativo no sensibilizada (Coombs indirecto negativo): inmunoglobulina anti-D a las 28 semanas y en las primeras 72 horas posparto si el recién nacido es Rh positivo. También tras aborto o procedimientos invasivos."],

// --- Cirugía
["apendicitis", "Escala de Alvarado", "Migración del dolor 1, anorexia 1, náusea o vómito 1, dolor en fosa iliaca derecha 2, rebote 1, fiebre 1, leucocitosis 2, desviación a la izquierda 1. Con 7 o más: alta probabilidad."],
["apendicitis", "Causa de la apendicitis según la edad", "Obstrucción de la luz: hiperplasia linfoide en niños y fecalito en adultos."],
["biliar", "Tríada de Charcot y pentada de Reynolds", "Charcot (colangitis): fiebre, ictericia y dolor en hipocondrio derecho. Reynolds agrega hipotensión y alteración del estado mental: colangitis grave."],
["biliar", "Colecistitis aguda: estudio inicial y tratamiento", "Ultrasonido: pared engrosada, líquido perivesicular, Murphy ultrasonográfico y litos. Colecistectomía laparoscópica temprana."],
["pancreatitis", "Pancreatitis aguda: criterios diagnósticos", "Dos de tres: dolor abdominal típico, lipasa o amilasa de 3 veces el límite superior o más, y hallazgos de imagen. Causa más frecuente: litiasis biliar; después, alcohol."],
["pancreatitis", "Pancreatitis: ¿antibiótico profiláctico?", "No. Solo con necrosis infectada o infección documentada. La base es hidratación, analgesia y alimentación enteral temprana."],
["trauma", "Evaluación primaria ABCDE", "A: vía aérea con control cervical · B: ventilación · C: circulación con control de hemorragia · D: déficit neurológico · E: exposición con control de hipotermia."],
["trauma", "Tríada de Beck", "Hipotensión, ingurgitación yugular y ruidos cardiacos velados: taponamiento cardiaco."],
["trauma", "Escala de Glasgow y vía aérea", "Con 8 puntos o menos se asegura la vía aérea. Respuesta ocular 4, verbal 5 y motora 6."],
["trauma", "Clases de choque hemorrágico: pérdida de sangre", "I: menos de 15% · II: 15 a 30% · III: 31 a 40% (aquí cae la presión arterial) · IV: más de 40%."],
["quemaduras", "Regla de los 9 en el adulto", "Cabeza 9% · cada extremidad superior 9% · tronco anterior 18% · tronco posterior 18% · cada extremidad inferior 18% · genitales 1%."],
["quemaduras", "Fórmula de Parkland", "4 ml × kg × porcentaje de superficie quemada (segundo y tercer grado), con Ringer lactato en 24 horas: la mitad en las primeras 8 horas desde la quemadura. Meta: diuresis de 0.5 ml/kg/h."],
["hernias", "Hernia inguinal más frecuente y su relación con los vasos epigástricos", "La indirecta, en ambos sexos: sale lateral a los vasos epigástricos inferiores, por el anillo inguinal profundo. La directa es medial, por el triángulo de Hesselbach."],
["hernias", "Hernia con mayor riesgo de estrangulación", "La femoral: más común en mujeres, protruye por debajo del ligamento inguinal."],
["oclusion", "Causas más frecuentes de oclusión intestinal", "Intestino delgado: adherencias posquirúrgicas y después hernias. Colon: cáncer colorrectal y después vólvulo de sigmoides (imagen en grano de café)."],
["sangrado_digestivo", "Causa más frecuente de hemorragia de tubo digestivo alto", "Úlcera péptica, por Helicobacter pylori o antiinflamatorios. Endoscopia en las primeras 24 horas tras estabilizar, con inhibidor de bomba de protones IV."],
["sangrado_digestivo", "Úlcera péptica perforada: hallazgo radiográfico", "Aire libre bajo el diafragma en la radiografía de tórax de pie, con abdomen en tabla. El tratamiento es quirúrgico."],
["tce", "Hematoma epidural contra subdural", "Epidural: arteria meníngea media, lente biconvexa, intervalo lúcido, no cruza suturas. Subdural: venas puente, semiluna, cruza suturas; adultos mayores y alcoholismo."],
["urologia", "Torsión testicular: datos y conducta", "Dolor súbito, testículo elevado y horizontal, sin reflejo cremastérico y sin alivio al elevarlo. Exploración quirúrgica antes de 6 horas."],
["urologia", "Litiasis urinaria: estudio de elección y lito más frecuente", "Tomografía simple, sin contraste. Oxalato de calcio. Los de estruvita (coraliformes) se asocian a infección por Proteus."],
["ortopedia", "Síndrome compartimental: primer signo y tratamiento", "Dolor desproporcionado que aumenta con el estiramiento pasivo; los pulsos se pierden tarde. Retirar vendajes o yeso y fasciotomía urgente."],
["ortopedia", "Fractura de cadera en el adulto mayor: postura de la extremidad", "Acortamiento y rotación externa después de una caída desde su propia altura."],
["diverticulitis", "Diverticulitis aguda: estudio de elección y qué evitar", "Tomografía con contraste. En la fase aguda se evitan la colonoscopia y el enema de bario, por riesgo de perforación."],

// --- Urgencias
["rcp", "RCP de alta calidad en el adulto", "100 a 120 compresiones por minuto, 5 a 6 cm de profundidad, reexpansión completa, relación 30:2, pausas menores de 10 segundos y relevo cada 2 minutos."],
["rcp", "Ritmos de paro desfibrilables y no desfibrilables", "Desfibrilables: fibrilación ventricular y taquicardia ventricular sin pulso. No desfibrilables: asistolia y actividad eléctrica sin pulso; en ellos, RCP, adrenalina y buscar las causas reversibles."],
["rcp", "Fármacos en el paro por fibrilación ventricular", "Adrenalina 1 mg IV cada 3 a 5 minutos, después de la segunda descarga. Amiodarona 300 mg después de la tercera descarga; segunda dosis de 150 mg."],
["intoxicaciones", "Intoxicación por paracetamol: antídoto", "N-acetilcisteína. Se decide con el nomograma de Rumack-Matthew a partir de las 4 horas de la ingesta."],
["intoxicaciones", "Síndrome colinérgico contra anticolinérgico", "Colinérgico (organofosforados): pupilas pequeñas, salivación, secreción bronquial, bradicardia y diarrea; atropina y pralidoxima. Anticolinérgico: pupilas grandes, piel seca y caliente, retención urinaria y delirio."],
["intoxicaciones", "Antídotos de opioides y de benzodiacepinas", "Opioides: naloxona. Benzodiacepinas: flumazenil, con precaución en usuarios crónicos por riesgo de convulsiones."],
["anafilaxia", "Anafilaxia: fármaco, dosis y vía", "Adrenalina 0.3 a 0.5 mg intramuscular (1:1,000) en la cara anterolateral del muslo; se repite cada 5 a 15 minutos. Niños: 0.01 mg/kg. Antihistamínicos y esteroides son coadyuvantes."],

// --- Salud Pública
["epidemiologia", "Sensibilidad y especificidad", "Sensibilidad = VP / (VP + FN): detecta enfermos; si es alta, un negativo descarta (tamizaje). Especificidad = VN / (VN + FP): reconoce sanos; si es alta, un positivo confirma."],
["epidemiologia", "Valores predictivos y prevalencia", "VPP = VP / (VP + FP). VPN = VN / (VN + FN). Dependen de la prevalencia: cuando sube, aumenta el VPP y baja el VPN."],
["epidemiologia", "Medida de asociación según el diseño", "Cohorte y ensayo clínico: riesgo relativo. Casos y controles: razón de momios. Transversal: razón de prevalencias."],
["epidemiologia", "Incidencia contra prevalencia", "Incidencia: casos nuevos en un periodo (riesgo). Prevalencia: casos existentes en un momento (carga). Prevalencia ≈ incidencia × duración."],
["epidemiologia", "Número necesario a tratar", "NNT = 1 / reducción absoluta del riesgo, donde la reducción absoluta es el riesgo en el grupo control menos el riesgo en los tratados."],
["prevencion", "Niveles de prevención", "Primaria: evitar la enfermedad (vacunas, promoción). Secundaria: detección y tratamiento tempranos (tamizaje). Terciaria: limitar el daño y rehabilitar. Cuaternaria: evitar intervenciones innecesarias."],
["prevencion", "Mortalidad materna e infantil: denominadores", "Razón de mortalidad materna: muertes maternas por 100,000 nacidos vivos. Mortalidad infantil: muertes en menores de un año por 1,000 nacidos vivos. Neonatal: primeros 28 días."],
["noms", "NOM-004", "Del expediente clínico."],

    cards: {}, qs: {}, err: [], dias: {}, gen: [], hoy: null, prio: {}, best: {}, rutas: {}, sims: [], stk: {}, full: {}, bk: 0 };

/* ---- estadísticas ---- */
function temaStat(t) {
  const qs = QT[t] || [], cs = CT[t] || [];
  let qSeen = 0, qOk = 0, cSeen = 0, box = 0;
  qs.forEach(id => { const r = S.qs[id]; if (r) { qSeen++; if (r.l) qOk++; } });
  cs.forEach(c => { const r = S.cards[c.id]; if (r) { cSeen++; box += r.b; } });
  const a = qSeen ? qOk / qSeen : null, b = cSeen ? (box / cSeen) / 5 : null;
  const score = a !== null && b !== null ? a * 0.6 + b * 0.4 : (a !== null ? a : b);

/* ---- tarjetas: repetición espaciada (cajas de Leitner) ---- */
function nuevasOrden() {

}

function planHoy() {

function conexiones(tema, omit) {
  const b = [];
  rutasDe(tema).filter(r => r.id !== omit).forEach(r => b.push(`<button class="btn sm" data-a="open-ruta" data-id="${r.id}">Ruta: ${esc(r.t)}</button>`));
  cuadrosDe(tema).filter(q => q.id !== omit).forEach(q => b.push(`<button class="btn sm" data-a="open-cuadro" data-id="${q.id}">Cuadro: ${esc(q.t)}</button>`));
  if ((CT[tema] || []).length) b.push(`<button class="btn sm" data-a="deck-tema" data-id="${tema}">${CT[tema].length} tarjetas del tema</button>`);
  b.push(`<button class="btn sm" data-a="tema" data-id="${tema}">Ficha: ${esc(TEMAS[tema].n)}</button>`);
  return b.join("");
}

V.casos = function () {
  const run = ui.run;
  if (run && run.fin) return runFin(run);
  if (run) return runVista(run);
  const f = ui.cf, list = casosFiltrados();
  const chA = [["", "Todas"]].concat(AREA_ORD.map(a => [a, AREAS[a].n])).map(x => `<button class="chip" data-a="cf-a" data-id="${x[0]}" aria-pressed="${f.a === x[0]}">${esc(x[1])}</button>`).join("");
  const chF = [["", "Todos"], ["nuevos", "Sin resolver"], ["fallados", "Con errores"], ["en", "En inglés"]].concat(S.gen.length ? [["ia", "Generados por IA"]] : []).map(x => `<button class="chip" data-a="cf-f" data-id="${x[0]}" aria-pressed="${f.f === x[0]}">${x[1]}</button>`).join("");
  const rows = list.map(c => {
    const rs = c.pregs.map((p, i) => S.qs[c.id + "." + i]), visto = rs.some(Boolean);
    return `<button class="item wide" data-a="run-one" data-id="${c.id}"><span class="stack" style="gap:2px"><span class="row" style="gap:8px"><span class="ficha">${esc(c.ficha || "Caso")}</span>${c.en ? '<span class="chip">EN</span>' : ""}${c.ia ? '<span class="chip warn">IA</span>' : ""}</span><span class="small muted">${visto ? esc(TEMAS[c.tema].n) + " · " : ""}${esc(corto(c.tx, 96))}</span></span><span class="stack meta" style="gap:6px;align-items:flex-end">${chipArea(TEMAS[c.tema].a)}<span class="dots">${rs.map(r => `<i class="${r ? (r.l ? "ok" : "bad") : ""}"></i>`).join("")}</span></span></button>`;
  }).join("");
  const nq = list.reduce((n, c) => n + c.pregs.length, 0);
  return `<header class="stack" style="gap:6px"><h1>Casos clínicos</h1><p class="muted">Viñetas con 2 o 3 preguntas, como en el examen. Al contestar ves por qué cada opción sí o no, y a dónde ir a reforzar.</p></header>
  <div class="stack" style="gap:8px"><div class="scroller">${chA}</div><div class="scroller">${chF}</div></div>
  <div class="row between"><span class="muted small">${list.length} casos · ${nq} preguntas</span><div class="row" style="gap:8px"><button class="btn sm" data-a="run-azar">5 al azar</button><button class="btn sm pri" data-a="run-lista">Resolver ${list.length}</button></div></div>
  <section class="sheet list" style="padding:4px 16px">${rows || '<p class="muted" style="padding:14px 0">Ningún caso con ese filtro.</p>'}</section>`;
};
ACT["cf-a"] = d => { ui.cf.a = d.id; render(); };
ACT["cf-f"] = d => { ui.cf.f = d.id; render(); };
ACT["run-one"] = d => startRun([d.id], { back: ui.view === "tema" ? "tema" : "casos" });
ACT["run-lista"] = () => startRun(casosFiltrados().map(c => c.id));
ACT["run-azar"] = () => startRun(shuffle(casosFiltrados()).slice(0, 5).map(c => c.id));
ACT["run-bit"] = () => { ui.run = null; go("bitacora"); };
ACT["run-exit"] = () => { const b = ui.run ? ui.run.back : "casos"; ui.run = null; go(b); };

function runVista(run) {
  const c = casoById(run.ids[run.ci]), p = c.pregs[run.qi], qid = c.id + "." + run.qi, perm = permDe(run, qid), done = run.pick !== null;
  const ok = done && run.pick === 0, L = "ABCD";
  const ops = perm.map((oi, k) => {
    const o = p.ops[oi]; let cls = "op";
    if (done) cls += oi === 0 ? " ok" : (oi === run.pick ? " bad" : "");
    return `<button class="${cls}" data-a="pick" data-i="${oi}"${done ? " disabled" : ""}><span class="k">${L[k]}</span><span${c.en ? ' lang="en"' : ""}>${esc(o[0])}</span>${done && o[1] ? `<span class="why">${esc(o[1])}</span>` : ""}</button>`;
  }).join("");
  const err = done && !ok ? S.err.find(e => e.q === qid && !e.r) : null;
  const ultima = run.ci === run.ids.length - 1 && run.qi === c.pregs.length - 1;
  const tot = run.ids.reduce((n, id) => n + casoById(id).pregs.length, 0), hechasQ = run.res.length;
  const fb = !done ? `<p class="kbd">Teclas 1 a 4 para elegir.</p>` : `
    <p class="verd ${ok ? "ok" : "bad"}">${ok ? "Correcto" : "Incorrecto: era la " + L[perm.indexOf(0)]}</p>
    ${p.perla ? `<div class="perla"><b>Para recordar</b>${esc(p.perla)}</div>` : ""}
    ${err ? `<div class="stack" style="gap:8px"><p class="small"><b>Quedó en tu bitácora</b> y las tarjetas de este tema volvieron a la caja 1. ¿Qué pasó?</p><div class="row" style="gap:6px">${MOTIVOS.map(m => `<button class="chip" data-a="motivo" data-q="${qid}" data-m="${m[0]}" aria-pressed="${err.m === m[0]}">${m[1]}</button>`).join("")}</div></div>` : ""}
    <div class="stack" style="gap:8px"><p class="eyebrow">Refuerza este tema</p><div class="row" style="gap:6px">${conexiones(c.tema)}</div></div>
    <div class="row ia-only"><button class="btn sm" data-a="explica" data-q="${qid}" data-p="${run.pick}">Explícamelo de otra forma</button><button class="btn sm ghost" data-a="ia-stop" id="ia-stop" hidden>Detener</button></div>
    <div class="ia-out" id="ia-out" hidden></div>
    <div class="dock"><button class="btn pri" data-a="next" id="next">${ultima ? "Ver resultado" : "Siguiente"}</button></div>`;
  return `<div class="prog">${volver("run-exit", "Salir")}<div class="bar" role="img" aria-label="Pregunta ${Math.min(tot, hechasQ + (done ? 0 : 1))} de ${tot}"><i style="width:${Math.round(hechasQ / tot * 100)}%"></i></div><span class="mono small muted">${Math.min(tot, hechasQ + (done ? 0 : 1))}/${tot}</span></div>
  <p class="eyebrow" style="margin-top:-10px">${esc(run.label)} · caso ${run.ci + 1} de ${run.ids.length} · pregunta ${run.qi + 1} de ${c.pregs.length}</p>
  <div class="play">${viñeta(c, { area: true, pin: true, voc: done, tema: done })}
    <section class="stack"><h2 class="q"${c.en ? ' lang="en"' : ""}>${esc(p.q)}</h2><div class="ops">${ops}</div>${fb}</section></div>`;
}
ACT.pick = (d, el, e) => {
  const run = ui.run; if (!run || run.pick !== null) return;
  const c = casoById(run.ids[run.ci]), qid = c.id + "." + run.qi, i = +d.i, ok = i === 0;
  run.pick = i; recQ(qid, ok, "caso"); run.res.push({ qid, ok }); save();
  sfx(ok ? "ok" : "bad"); vibra(ok ? 12 : [18, 40, 18]);
  if (ok && e && typeof e.clientX === "number" && (e.clientX || e.clientY)) fiesta(12, e.clientX, e.clientY);
  fresco(); render();
  const n = $("#next"); if (n) { try { n.focus({ preventScroll: true }); } catch (e) { /* idem */ } }
};
ACT.next = () => {
  const run = ui.run; if (!run) return; const c = casoById(run.ids[run.ci]);
  run.pick = null; iaAbort();
  if (run.qi < c.pregs.length - 1) run.qi++; else if (run.ci < run.ids.length - 1) { run.ci++; run.qi = 0; } else { run.fin = true; sfx("fin"); if (run.res.every(r => r.ok)) fiesta(60); }
  render(); entra(); arriba();
};
ACT.motivo = d => { const e = S.err.find(x => x.q === d.q && !x.r); if (!e) return; e.m = e.m === d.m ? "" : d.m; save(); render(); };

function runFin(run) {
  const k = run.res.filter(r => r.ok).length, n = run.res.length, temas = [];
  run.res.forEach(r => { const t = QI[r.qid].c.tema; if (!r.ok && !temas.includes(t)) temas.push(t); });
  const rows = run.res.map(r => { const q = QI[r.qid]; return `<div class="item"><span><span class="small muted">${esc(TEMAS[q.c.tema].n)}</span><br>${esc(q.p.q)}</span><span class="dots"><i class="${r.ok ? "ok" : "bad"}"></i></span></div>`; }).join("");
  return `<header class="score">${anillo(k, n, k + " de " + n + " correctas")}<div class="stack" style="gap:6px"><p class="eyebrow">${esc(run.label)}</p><h1>${k === n ? "Perfecto" : k / n >= 0.6 ? "Bien hecho" : "A repasar"}</h1></div></header>
    <p class="muted">${k} de ${n} correctas. ${k === n ? "Sin errores: estos temas van bien, sigue con otros." : "Lo que fallaste ya está en tu bitácora y sus tarjetas te esperan hoy."}</p>
  <section class="sheet list" style="padding:4px 16px">${rows}</section>
  ${temas.length ? `<section class="stack"><h2>Refuerza ahora</h2>${temas.map(t => `<div class="row" style="gap:6px">${conexiones(t)}</div>`).join("")}</section>` : ""}
  <div class="dock"><button class="btn pri" data-a="run-exit">Terminar</button>${k < n ? `<button class="btn" data-a="run-bit">Ir a la bitácora</button>` : ""}</div>`;
}

/* ===== Vistas: Tarjetas, Rutas y cuadros ===== */

/* ---------- Tarjetas ---------- */
function startDeck(ids, opt) {
  ids = (ids || []).filter(id => CARD[id]);
  if (!ids.length) { toast("No hay tarjetas pendientes aquí."); return; }
  ui.deck = Object.assign({ q: ids.slice(), i: 0, flip: false, again: {}, n: 0, back: "tarjetas", label: "Tarjetas", fin: false }, opt || {});
  go("tarjetas");
}
V.tarjetas = function () {
  const dk = ui.deck;
  if (dk && dk.fin) {
    return `<header class="score">${anillo(dk.n, dk.n, dk.n + " tarjetas repasadas")}<div class="stack" style="gap:6px"><p class="eyebrow">${esc(dk.label)}</p><h1>${dk.n === 1 ? "Tarjeta repasada" : "Tarjetas repasadas"}</h1></div></header>
    <p class="muted">Cada una ya tiene fecha para volver. Las que no supiste regresan hoy mismo.</p>
    <div class="dock"><button class="btn pri" data-a="deck-exit">Terminar</button>${dk.tema ? `<button class="btn" data-a="deck-casos" data-id="${dk.tema}">Casos del tema</button>` : `<button class="btn" data-a="deck-casos">Pasar a los casos</button>`}</div>`;
  }
  if (dk) {
    const c = CARD[dk.q[dk.i]], T = TEMAS[c.tema];
    const g = k => proxima(c.id, k).en;
    const dias = n => n === 0 ? "vuelve hoy" : n === 1 ? "mañana" : "en " + n + " días";
    return `<div class="prog">${volver("deck-exit", "Salir")}<div class="bar" role="img" aria-label="Tarjeta ${dk.i + 1} de ${dk.q.length}"><i style="width:${Math.round(dk.i / dk.q.length * 100)}%"></i></div><span class="mono small muted">${dk.i + 1}/${dk.q.length}</span></div>
    <div class="row" style="margin-top:-8px">${chipArea(T.a)}<span class="chip">${esc(T.n)}</span></div>
    <button class="fc${dk.flip ? " back" : ""}" data-a="flip" id="fc" aria-live="polite">
      ${dk.flip ? `<span class="hint">Respuesta</span><span class="f">${esc(c.f)}</span><span class="b">${esc(c.b)}</span>` : `<span class="hint">Piensa la respuesta y toca para voltear</span><span class="f">${esc(c.f)}</span>`}
    </button>
    ${dk.flip ? `<div class="dock"><div class="grades"><button class="btn g-no" data-a="grade" data-g="no">No la sabía<small>${dias(g("no"))}</small></button><button class="btn" data-a="grade" data-g="duda">Dudé<small>${dias(g("duda"))}</small></button><button class="btn g-si" data-a="grade" data-g="si">La sabía<small>${dias(g("si"))}</small></button></div></div><p class="kbd">Teclas 1, 2 y 3.</p>`
      : `<div class="dock"><button class="btn pri" data-a="flip">Voltear</button><span class="kbd">o barra espaciadora</span></div>`}`;
  }
  const dc = dueCards(), n = dc.due.length + dc.nuevas.length;
  const cnt = [0, 0, 0, 0, 0, 0]; CARDS.forEach(c => { const r = S.cards[c.id]; cnt[r ? r.b : 0]++; });
  const lab = ["Sin ver", "Caja 1 · hoy", "Caja 2 · 3 días", "Caja 3 · 7 días", "Caja 4 · 16 días", "Caja 5 · 35 días"];
  const boxes = barras(cnt.map((v, i) => ({ v, txt: String(v), lab: lab[i], cls: i === 0 ? "new" : "" })), 96);
  const areas = AREA_ORD.map(a => { const k = CARDS.filter(c => TEMAS[c.tema].a === a).length; return `<button class="chip c-${AREAS[a].c}" data-a="deck-area" data-id="${a}">${esc(AREAS[a].n)} · ${k}</button>`; }).join("");
  return `<header class="stack" style="gap:6px"><h1>Tarjetas</h1><p class="muted">Repetición espaciada: cada acierto manda la tarjeta a la siguiente caja y tarda más en volver. Cada fallo la regresa a la caja 1.</p></header>
  <section class="sheet stack"><div class="row between"><div><h2>${n ? n + " para hoy" : "Nada pendiente hoy"}</h2><p class="small muted">${dc.due.length} de repaso y ${dc.nuevas.length} nuevas (máximo ${NUEVAS_DIA} nuevas al día).</p></div>${n ? `<button class="btn pri" data-a="deck-hoy">Repasar</button>` : ""}</div>
    ${boxes}</section>
  <section class="stack"><h2>Repaso libre por área</h2><p class="small muted">Fuera de calendario, para un tema que quieras apretar. También cuenta para las cajas.</p><div class="row" style="gap:6px">${areas}</div></section>`;
};
ACT["deck-casos"] = d => { ui.deck = null; if (d.id) startRun(CAS.filter(c => c.tema === d.id).map(c => c.id), { back: "tema", label: TEMAS[d.id].n, tema: d.id }); else go("casos"); };
ACT.flip = () => { if (ui.deck && !ui.deck.fin) { ui.deck.flip = !ui.deck.flip; sfx("flip"); render(); const f = $("#fc"); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* idem */ } } } };
ACT.grade = d => {
  const dk = ui.deck; if (!dk || !dk.flip) return; const id = dk.q[dk.i];
  gradeCard(id, d.g); dk.n++;
  if (d.g === "no" && (dk.again[id] || 0) < 2) { dk.again[id] = (dk.again[id] || 0) + 1; dk.q.push(id); }
  dk.i++; dk.flip = false; sfx(d.g === "si" ? "si" : "tap"); vibra(8); if (dk.i >= dk.q.length) { dk.fin = true; sfx("fin"); fiesta(40); }
  save(); render();
};
ACT["deck-exit"] = () => { const b = ui.deck ? ui.deck.back : "tarjetas"; ui.deck = null; go(b); };
ACT["deck-area"] = d => startDeck(shuffle(CARDS.filter(c => TEMAS[c.tema].a === d.id)).slice(0, 20).map(c => c.id), { label: AREAS[d.id].n });

/* ---------- Rutas y cuadros ---------- */
V.visual = function () {
  const tabs = [["rutas", "Rutas"], ["cuadros", "Cuadros"], ["juego", "Empareja"], ["tabla", "Tabla 2×2"]]
    .map(x => `<button class="chip" data-a="vsub" data-id="${x[0]}" aria-pressed="${ui.vsub === x[0]}">${x[1]}</button>`).join("");
  let body = "";
  if (ui.vsub === "rutas") body = ui.ruta ? rutaVista() : `<p class="muted">Algoritmos que recorres tomando las decisiones tú. Al final puedes ver el mapa completo.</p><section class="sheet list" style="padding:4px 16px">${RUTAS.map(r => `<button class="item wide" data-a="open-ruta" data-id="${r.id}"><span><b>${esc(r.t)}</b><br><span class="small muted">${esc(r.sub)}</span></span><span class="stack meta" style="gap:6px;align-items:flex-end">${chipArea(TEMAS[r.tema].a)}<span class="small muted">${S.rutas[r.id] ? "recorrida el " + esc(fecha(S.rutas[r.id], { day: "numeric", month: "short" })) : "sin recorrer"}</span></span></button>`).join("")}</section>`;
  else if (ui.vsub === "cuadros") body = ui.cuadro ? cuadroVista() : `<p class="muted">Lo que el examen te pide distinguir, lado a lado. Con el modo repaso tapas las celdas y las destapas al recordarlas.</p><section class="sheet list" style="padding:4px 16px">${CUADROS.map(q => `<button class="item wide" data-a="open-cuadro" data-id="${q.id}"><span><b>${esc(q.t)}</b><br><span class="small muted">${q.filas.length} filas · ${q.cols.length - 1} columnas</span></span><span class="stack meta" style="gap:6px;align-items:flex-end">${chipArea(TEMAS[q.temas[0]].a)}</span></button>`).join("")}</section>`;
  else if (ui.vsub === "juego") body = ui.juego ? juegoVista() : `<p class="muted">Seis pares por ronda. Toca un elemento de la izquierda y luego su pareja.</p><section class="sheet list" style="padding:4px 16px">${JUEGOS.map(j => `<button class="item" data-a="open-juego" data-id="${j.id}"><span><b>${esc(j.t)}</b><br><span class="small muted">${j.pares.length} pares</span></span><span class="mono small muted">${S.best[j.id] ? "mejor: " + mmss(S.best[j.id] / 1000) : "sin jugar"}</span></button>`).join("")}</section>`;
  else body = tablaVista();
  return `<header class="stack" style="gap:10px"><h1>Rutas y cuadros</h1><div class="scroller">${tabs}</div></header>${body}`;
};
ACT.vsub = d => { ui.ruta = null; ui.cuadro = null; ui.juego = null; go("visual", { vsub: d.id }); };

/* rutas */
ACT["open-ruta"] = d => { const r = RUTAS.find(x => x.id === d.id); if (!r) return; go("visual", { vsub: "rutas", ruta: { id: r.id, path: [{ id: r.ini, pick: null }], map: false } }); };
function rutaVista() {
  const st = ui.ruta, r = RUTAS.find(x => x.id === st.id), TAG = { d: "Decisión", a: "Acción", f: "Desenlace" };
  const steps = st.path.map((s, i) => {
    const n = r.n[s.id], last = i === st.path.length - 1;
    let inner = `<span class="tag">${TAG[n.k]}</span><p>${esc(n.tx)}</p>`;
    if (last && n.k === "d") inner += `<div class="row" style="gap:6px">${n.ops.map((o, k) => `<button class="btn" data-a="ruta-pick" data-i="${k}">${esc(o[0])}</button>`).join("")}</div>`;
    if (last && n.k === "a") inner += `<div class="row"><button class="btn pri" data-a="ruta-next">Hecho, ¿qué sigue?</button></div>`;
    return `<div class="node ${n.k}${last ? "" : " past"}"${last ? ' id="nodo"' : ""}>${inner}</div>${last ? "" : `<div class="conn">${s.pick ? `<span class="chip">${esc(s.pick)}</span>` : ""}</div>`}`;
  }).join("");
  const fin = r.n[st.path[st.path.length - 1].id].k === "f";
  const done = new Set();
  return `<div class="row between">${volver("ruta-list", "Rutas")}<div class="row" style="gap:6px">${chipArea(TEMAS[r.tema].a)}</div></div>
  <div class="stack" style="gap:4px"><h2>${esc(r.t)}</h2><p class="muted">${esc(r.sub)}</p></div>
  <div class="flow">${steps}</div>
  <div class="row">${st.path.length > 1 ? `<button class="btn sm" data-a="ruta-undo">Deshacer un paso</button><button class="btn sm" data-a="open-ruta" data-id="${r.id}">Empezar de nuevo</button>` : ""}<button class="btn sm" data-a="ruta-map">${st.map ? "Ocultar el mapa completo" : "Ver el mapa completo"}</button></div>
  ${fin ? `<div class="stack" style="gap:8px"><p class="eyebrow">Ponlo a prueba</p><div class="row" style="gap:6px">${(QT[r.tema] || []).length ? `<button class="btn sm pri" data-a="run-tema" data-id="${r.tema}">Resolver casos de este tema</button>` : ""}${conexiones(r.tema, r.id)}</div></div>` : ""}
  ${st.map ? `<section class="sheet" style="overflow-x:auto"><ul class="tree">${arbol(r, r.ini, done)}</ul></section>` : ""}`;
}
function arbol(r, id, done) {
  const n = r.n[id];
  if (done.has(id)) return `<li class="muted">↩ continúa en: ${esc(corto(n.tx, 60))}</li>`;
  done.add(id);
  if (n.k === "f") return `<li><b>Desenlace.</b> ${esc(n.tx)}</li>`;
  if (n.k === "a") return `<li>${esc(n.tx)}</li>${arbol(r, n.sig, done)}`;
  return `<li><b>${esc(n.tx)}</b>${n.ops.map(o => `<ul><li class="opt">${esc(o[0])}</li>${arbol(r, o[1], done)}</ul>`).join("")}</li>`;
}
function rutaAvanza(dest, pick) {
  const st = ui.ruta, r = RUTAS.find(x => x.id === st.id);
  st.path[st.path.length - 1].pick = pick; st.path.push({ id: dest, pick: null });
  if (r.n[dest].k === "f") { S.rutas[r.id] = dnum(); save(); sfx("fin"); } else sfx("tap");
  render(); const el = $("#nodo"); if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { /* idem */ } }
}
ACT["ruta-pick"] = d => { const st = ui.ruta, r = RUTAS.find(x => x.id === st.id), n = r.n[st.path[st.path.length - 1].id], o = n.ops[+d.i]; if (o) rutaAvanza(o[1], o[0]); };
ACT["ruta-next"] = () => { const st = ui.ruta, r = RUTAS.find(x => x.id === st.id), n = r.n[st.path[st.path.length - 1].id]; if (n.sig) rutaAvanza(n.sig, ""); };
ACT["ruta-undo"] = () => { const st = ui.ruta; if (st.path.length > 1) { st.path.pop(); st.path[st.path.length - 1].pick = null; render(); } };
ACT["ruta-map"] = () => { ui.ruta.map = !ui.ruta.map; render(); };
ACT["ruta-list"] = () => { ui.ruta = null; render(); };

/* cuadros */

}
function pintaTabla() {
  const out = $("#t2out"); if (!out) return;

  const vp = Math.round(enf * t.s / 100), fn = enf - vp, vn = Math.round(san * t.e / 100), fp = san - vn;
  const vpp = vp + fp ? vp / (vp + fp) : 0, vpn = vn + fn ? vn / (vn + fn) : 0;
  const p1 = x => { const r = Math.round(x * 1000) / 10; return (x < 1 && r >= 100 ? 99.9 : r).toLocaleString("es-MX"); };
  const dots = "<i class='d-vp'></i>".repeat(vp) + "<i class='d-fn'></i>".repeat(fn) + "<i class='d-fp'></i>".repeat(fp) + "<i class='d-vn'></i>".repeat(vn);
  out.innerHTML = `<div class="row" style="align-items:flex-start;gap:20px 28px"><div class="grow" style="min-width:240px"><div class="dotgrid" role="img" aria-label="${vp} verdaderos positivos, ${fn} falsos negativos, ${fp} falsos positivos, ${vn} verdaderos negativos">${dots}</div></div>
    <div class="stack grow" style="min-width:240px"><div class="legend"><span><i class="d-vp"></i>Verdadero positivo: ${vp}</span><span><i class="d-fn"></i>Falso negativo: ${fn}</span><span><i class="d-fp"></i>Falso positivo: ${fp}</span><span><i class="d-vn"></i>Verdadero negativo: ${vn}</span></div>
      <div class="kpis"><div class="kpi"><b class="mono">${p1(vpp)}%</b><span class="small">Valor predictivo positivo</span></div><div class="kpi"><b class="mono">${p1(vpn)}%</b><span class="small">Valor predictivo negativo</span></div></div>
      <p>De cada 100 resultados positivos, <b>${p1(vpp)}</b> son de personas enfermas. De cada 100 negativos, <b>${p1(vpn)}</b> son de personas sanas.</p>

/* ---------- Simulacro ---------- */
let simT = null;
function simPool(en) { return CAS.filter(c => en || !c.en); }
V.simulacro = function () {
  const sim = ui.sim;
  if (sim && sim.fin) return simRes(sim);
  if (sim) return simVista(sim);
  const cfg = ui.simCfg, total = simPool(cfg.en).reduce((n, c) => n + c.pregs.length, 0);
  const sizes = [10, 20, 40, 60].filter(n => n <= total);
  if (!sizes.includes(cfg.n)) cfg.n = sizes[Math.min(1, sizes.length - 1)] || total;
  const hist = S.sims.slice(0, 8).reverse();
  return `<header class="stack" style="gap:6px"><h1>Simulacro</h1><p class="muted">Con reloj y sin retroalimentación hasta entregar, como el examen. Aquí entrenas el ritmo: ${SEG_PREG} segundos por pregunta.</p></header>
  <section class="sheet stack"><h2>Arma tu simulacro</h2>
    <div class="row" style="gap:6px">${sizes.map(n => `<button class="chip" data-a="sim-n" data-id="${n}" aria-pressed="${cfg.n === n}">${n} preguntas</button>`).join("")}</div>
    <div class="row" style="gap:6px"><button class="chip" data-a="sim-en" aria-pressed="${cfg.en}">Incluir casos en inglés</button></div>
    <p>Tiempo: <b class="mono">${mmss(cfg.n * SEG_PREG)}</b>. Al terminar, los errores entran a tu bitácora.</p>
    <div class="row"><button class="btn pri" data-a="sim-start">Comenzar</button></div></section>
  ${hist.length ? `<section class="stack"><h2>Tus simulacros</h2>${barras(hist.map(h => ({ v: Math.round(h.k / h.n * 100), txt: Math.round(h.k / h.n * 100) + "%", lab: fecha(h.d, { day: "numeric", month: "short" }) })), 90, 100)}</section>` : ""}
  <p class="small muted">Este banco tiene ${total} preguntas propias: sirve para medir ritmo y afianzar temas. Para volumen, combínalo con un banco grande de preguntas.</p>`;
};
ACT["sim-n"] = d => { ui.simCfg.n = +d.id; render(); };
ACT["sim-en"] = () => { ui.simCfg.en = !ui.simCfg.en; render(); };
ACT["sim-start"] = () => {
  const cfg = ui.simCfg, qs = [];
  shuffle(simPool(cfg.en)).forEach(c => { if (qs.length < cfg.n) c.pregs.forEach((p, i) => { if (qs.length < cfg.n) qs.push(c.id + "." + i); }); });
  ui.sim = { qs, i: 0, ans: {}, flag: {}, perm: {}, t0: Date.now(), dur: qs.length * SEG_PREG, fin: false, conf: false };
  clearInterval(simT); simT = setInterval(simTick, 1000);
