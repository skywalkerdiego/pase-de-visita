};
function simLeft() { const s = ui.sim; return s ? s.dur - (Date.now() - s.t0) / 1000 : 0; }
function simTick() {
  const s = ui.sim; if (!s || s.fin) { clearInterval(simT); return; }
  const left = simLeft(); if (left <= 0) { simEntrega(); return; }
  const el = $("#clock"); if (el) { el.textContent = mmss(left); el.classList.toggle("low", left < 120); }
}
function simVista(sim) {
  const qid = sim.qs[sim.i], q = QI[qid], perm = permDe(sim, qid), L = "ABCD", left = simLeft();
  const sinResp = sim.qs.filter(id => sim.ans[id] === undefined).length;
  const ops = perm.map((oi, k) => `<button class="op${sim.ans[qid] === oi ? " sel" : ""}" data-a="sim-pick" data-i="${oi}"><span class="k">${L[k]}</span><span${q.c.en ? ' lang="en"' : ""}>${esc(q.p.ops[oi][0])}</span></button>`).join("");
  const grid = sim.qs.map((id, i) => `<button class="qn${sim.ans[id] !== undefined ? " ans" : ""}${sim.flag[id] ? " flag" : ""}${i === sim.i ? " cur" : ""}" data-a="sim-go" data-i="${i}" aria-label="Pregunta ${i + 1}${sim.ans[id] !== undefined ? ", respondida" : ""}${sim.flag[id] ? ", marcada" : ""}">${i + 1}</button>`).join("");
  return `<div class="simbar"><span class="clock${left < 120 ? " low" : ""}" id="clock" aria-label="Tiempo restante">${mmss(left)}</span><span class="mono small muted">Pregunta ${sim.i + 1} de ${sim.qs.length}</span>
    ${sim.conf ? `<span class="row" style="gap:6px"><span class="small">${sinResp ? "Quedan " + sinResp + " sin responder." : "Todas respondidas."}</span><button class="btn sm pri" data-a="sim-end">Sí, entregar</button><button class="btn sm" data-a="sim-conf">Seguir</button></span>` : `<button class="btn sm" data-a="sim-conf">Entregar</button>`}</div>
  <div class="play">${viñeta(q.c, { pin: true })}
    <section class="stack"><h2 class="q"${q.c.en ? ' lang="en"' : ""}>${esc(q.p.q)}</h2><div class="ops">${ops}</div>
      <div class="dock"><button class="btn" data-a="sim-go" data-i="${sim.i - 1}"${sim.i === 0 ? " disabled" : ""}>Anterior</button><button class="chip" data-a="sim-flag" aria-pressed="${!!sim.flag[qid]}">Marcar</button>${sim.i === sim.qs.length - 1 ? `<button class="btn pri" data-a="sim-conf2">Entregar</button>` : `<button class="btn pri" data-a="sim-go" data-i="${sim.i + 1}">Siguiente</button>`}</div></section></div>
  <section class="stack"><p class="eyebrow">Navegación</p><div class="qgrid">${grid}</div></section>`;
}
ACT["sim-pick"] = d => { const s = ui.sim; if (!s || s.fin) return; s.ans[s.qs[s.i]] = +d.i; sfx("tap"); render(); };
ACT["sim-go"] = d => { const s = ui.sim, i = +d.i; if (!s || i < 0 || i >= s.qs.length) return; s.i = i; s.conf = false; render(); try { window.scrollTo(0, 0); } catch (e) { /* idem */ } };
ACT["sim-flag"] = () => { const s = ui.sim, id = s.qs[s.i]; s.flag[id] = !s.flag[id]; render(); };
ACT["sim-conf"] = () => { ui.sim.conf = !ui.sim.conf; render(); };
ACT["sim-conf2"] = () => { ui.sim.conf = true; render(); arriba(); };
ACT["sim-end"] = () => simEntrega();
function simEntrega() {
  const s = ui.sim; if (!s || s.fin) return;
  clearInterval(simT);
  const secs = Math.min(s.dur, (Date.now() - s.t0) / 1000), by = {}; let k = 0;
  s.qs.forEach(id => {
    const a = s.ans[id], ok = a === 0, ar = TEMAS[QI[id].c.tema].a;
    by[ar] = by[ar] || { n: 0, k: 0 }; by[ar].n++; if (ok) { by[ar].k++; k++; }
    recQ(id, ok, "sim", a === undefined ? "prisa" : "");
  });
  s.fin = true; s.res = { k, n: s.qs.length, secs, by };
  S.sims.unshift({ d: dnum(), n: s.qs.length, k, s: Math.round(secs) }); S.sims = S.sims.slice(0, 30);
  save(); sfx("fin"); if (k / s.qs.length >= 0.7) fiesta(60); if (ui.view === "simulacro") { render(); try { window.scrollTo(0, 0); } catch (e) { /* idem */ } } else toast("Se acabó el tiempo del simulacro: tu resultado está en Simulacro.");

function simRes(sim) {

  const areas = AREA_ORD.filter(a => r.by[a]).map(a => `<div class="hbar c-${AREAS[a].c}"><span>${esc(AREAS[a].n)}</span><div class="bar"><i style="width:${Math.round(r.by[a].k / r.by[a].n * 100)}%"></i></div><span class="mono">${r.by[a].k}/${r.by[a].n}</span></div>`).join("");
  const rev = sim.qs.map((id, i) => {
    const q = QI[id], a = sim.ans[id], ok = a === 0, perm = permDe(sim, id);
    return `<details><summary><span class="dots" style="display:inline-flex;margin-right:8px"><i class="${ok ? "ok" : "bad"}"></i></span>${i + 1}. ${esc(corto(q.p.q, 90))}</summary>
      <p class="small muted">${esc(TEMAS[q.c.tema].n)} · ${esc(q.c.ficha || "")}</p><p>${esc(q.c.tx)}</p>
      <p>${a === undefined ? "<b>Sin responder.</b>" : `Tu respuesta: <b>${L[perm.indexOf(a)]}.</b> ${esc(q.p.ops[a][0])}${ok ? "" : ` <span class="muted">— ${esc(q.p.ops[a][1] || "")}</span>`}`}</p>
      ${ok ? "" : `<p>Correcta: <b>${L[perm.indexOf(0)]}.</b> ${esc(q.p.ops[0][0])}</p>`}<p>${esc(q.p.ops[0][1] || "")}</p>
      ${q.p.perla ? `<div class="perla"><b>Para recordar</b>${esc(q.p.perla)}</div>` : ""}<div class="row" style="gap:6px">${conexiones(q.c.tema)}</div></details>`;
  }).join("");

  <div class="kpis"><div class="kpi"><b class="mono">${mmss(r.secs)}</b><span class="small">tiempo usado de ${mmss(sim.dur)}</span></div><div class="kpi"><b class="mono">${Math.round(sxp)} s</b><span class="small">por pregunta (meta: ${SEG_PREG} s)</span></div><div class="kpi"><b class="mono">${r.n - r.k}</b><span class="small">errores enviados a la bitácora</span></div></div>

/* ---------- Bitácora ---------- */

      <label class="field" for="${id}">Tu nota: qué dato se te fue<input type="text" id="${id}" data-nota="${e.q}" value="${esc(e.n || "")}" placeholder="Por ejemplo: con potasio menor de 3.3 no se inicia insulina" maxlength="240"></label>
      <div class="row"><button class="btn sm pri" data-a="retry" data-q="${e.q}">Reintentar el caso</button><span class="small muted">Se resuelve cuando la aciertes otro día.</span></div></div>`;
  }).join("");
  const chA = [["", "Todas"]].concat(AREA_ORD.filter(a => open.some(e => TEMAS[QI[e.q].c.tema].a === a)).map(a => [a, AREAS[a].n])).map(x => `<button class="chip" data-a="tf" data-id="${x[0]}" aria-pressed="${fa === x[0]}">${esc(x[1])}</button>`).join("");
  return `<header class="stack" style="gap:6px"><h1>Bitácora de errores</h1><p class="muted">${open.length} abiertos · ${res.length} resueltos. Clasifica cada error y anota el dato que te faltó.</p></header>

  <section class="stack"><div class="row between"><h2>Abiertos</h2><div class="row" style="gap:6px">${chA}</div></div><div class="sheet" style="padding:0 18px">${lista || '<p class="muted" style="padding:16px 0">Nada abierto aquí.</p>'}</div></section>
  ${res.length ? `<details><summary>Resueltos (${res.length})</summary>${res.slice(0, 40).map(e => `<p class="small">${esc(TEMAS[QI[e.q].c.tema].n)}: ${esc(QI[e.q].p.q)}${e.n ? ` <span class="muted">— ${esc(e.n)}</span>` : ""}</p>`).join("")}</details>` : ""}`;
};

document.addEventListener("change", e => {

  { id: "racha30", n: "Luna llena", d: "Estudia 30 días seguidos", i: "moon", ok: t => t.racha >= 30 },
  { id: "q50", n: "Chispa", d: "Responde 50 preguntas", i: "spark", ok: t => t.q >= 50 },
  { id: "q250", n: "Diamante", d: "Responde 250 preguntas", i: "gem", ok: t => t.q >= 250 },
  { id: "cards", n: "Jardín", d: "Conoce 60 tarjetas", i: "flower", ok: t => t.cv >= 60 },
  { id: "rutas", n: "Todo el mapa", d: "Recorre todas las rutas", i: "bow", ok: t => t.rutas >= RUTAS.length },
  { id: "sim", n: "Contra reloj", d: "Termina tu primer simulacro", i: "clock", ok: t => t.sims >= 1 },
  { id: "dia", n: "Día redondo", d: "Cumple las 4 indicaciones en un día", i: "arc", ok: t => t.full >= 1 },
  { id: "res", n: "Lección aprendida", d: "Resuelve 10 errores de tu bitácora", i: "leaf", ok: t => t.res >= 10 }
];
let festejo = [];
function indicaciones() {
  const t = dnum(), dc = dueCards(), plan = planHoy();
  const ch = plan.c.map(casoById).filter(Boolean);
  const sinClas = errAbiertos().filter(e => !e.m).length, dr = S.dias[dstr(t)] || { q: 0, c: 0 };
  return [dc.due.length + dc.nuevas.length === 0, ch.length > 0 && ch.every(casoHechoHoy), S.rutas[plan.r] === t, sinClas === 0 && (dr.q + dr.c) > 0];
}
function logros() {
  const t = dnum(), hoy = dstr(t);
  S.full = S.full || {}; S.stk = S.stk || {};
  if (!S.full[hoy] && indicaciones().every(Boolean)) { S.full[hoy] = 1; festejo.push("Día redondo: cumpliste las 4 indicaciones."); }
  const tt = totales();
  STICKERS.forEach(s => { if (!S.stk[s.id] && s.ok(tt)) { S.stk[s.id] = t; festejo.push("Sticker nuevo: " + s.n); } });
  if (festejo.length) { const m = festejo.join(" · "); festejo = []; setTimeout(() => { toast(m); sfx("sticker"); fiesta(46); }, 450); }
}
V.stickers = function () {
  const n = STICKERS.filter(s => S.stk[s.id]).length;
  return `<header class="stack" style="gap:6px"><h1>Stickers${DESTELLO}</h1><p class="muted">${n} de ${STICKERS.length}. Se ganan estudiando; cada uno marca un hábito que sube tu puntaje.</p></header>
  <div class="stk">${STICKERS.map(s => `<div class="st${S.stk[s.id] ? " on" : ""}">${svg(s.i)}<b>${s.n}</b><span>${S.stk[s.id] ? "Ganado el " + esc(fecha(S.stk[s.id], { day: "numeric", month: "short" })) : s.d}</span></div>`).join("")}</div>`;
};

/* ---- notitas del día ---- */
const NOTITAS = [
  "Hoy no tienes que saberlo todo: solo un poco más que ayer.",
  "Cada error que anotas hoy es un punto que no pierdes en septiembre.",
  "Vas por tu plaza, una tarjeta a la vez.",
  "Lo difícil de hoy es lo fácil del examen.",
  "Constancia le gana a intensidad. Ya llegaste: eso cuenta.",
  "Una doctora que repasa sus errores es una doctora que no los repite.",
  "Quince minutos bien hechos valen más que tres horas de culpa.",
  "Tu yo de septiembre te va a agradecer este ratito.",
  "No estudias para el examen: estudias para tus pacientes. El examen viene incluido.",
  "Respira. Lee la pregunta primero. Tú sabes más de lo que crees.",
  "Si hoy te costó, es que hoy aprendiste.",
  "La residencia se gana en días como este, los que nadie ve.",
  "Pregunta por pregunta, ya eres mejor médica que la semana pasada.",
  "Descansar también es parte del plan. Hoy cumple y cierra."
];
const notita = () => NOTITAS[dnum() % NOTITAS.length];
ACT.sonido = () => { S.cfg.sonido = !S.cfg.sonido; save(); render(); if (S.cfg.sonido) sfx("ok"); toast(S.cfg.sonido ? "Sonido activado." : "Sonido apagado."); };
const btnSonido = cls => `<button class="btn sm${cls ? " " + cls : ""}" data-a="sonido" aria-pressed="${!!S.cfg.sonido}">${S.cfg.sonido ? "Sonido: sí" : "Sonido: no"}</button>`;

/* ===== Gráfica de barras a escala (una sola cuadrícula: valores, barras, etiquetas) ===== */
function barras(items, h, max) {
  const mx = max || Math.max(1, ...items.map(x => x.v));
  return `<div class="bars" style="--n:${items.length};--h:${h}px" role="img" aria-label="${esc(items.map(x => x.lab + ": " + (x.txt != null ? x.txt : x.v)).join(", "))}">` +
    items.map(x => `<b>${x.txt != null ? esc(x.txt) : (x.v || "")}</b>`).join("") +
    items.map(x => `<i class="${x.v ? "" : "zero"}${x.cls ? " " + x.cls : ""}" style="height:${x.v ? Math.max(3, Math.round(x.v / mx * h)) : 2}px"></i>`).join("") +
    items.map(x => `<span>${esc(x.lab)}</span>`).join("") + `</div>`;
}

/* ===== Capacidades de Claude: tutor (sample) y sincronización (db + user) ===== */
const use = n => { try { return window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };

/* ---- tutor ---- */
let sample = null, iaCtl = null;
function iaAbort() { if (iaCtl) { try { iaCtl.abort(); } catch (e) { /* idem */ } iaCtl = null; } }
function iaOff() { sample = null; document.documentElement.classList.remove("ia"); }
function iaMsg(code) {
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { iaOff(); return "El tutor no está disponible en esta vista."; }
  if (code === "rate_limited") return "Llegaste al límite de uso por ahora. Inténtalo más tarde.";
  if (code === "session_expired") return "Tu sesión de Claude expiró: vuelve a iniciar sesión.";
  if (code === "refused" || code === "empty_completion") return "No hubo respuesta para esta pregunta.";
  if (code === "invalid_json") return "La respuesta llegó incompleta. Inténtalo de nuevo.";
  return "Se interrumpió la conexión. Inténtalo de nuevo.";
}
ACT["ia-stop"] = () => iaAbort();
ACT.explica = async (d, btn) => {
  if (!sample) return; const q = QI[d.q], out = $("#ia-out"), stop = $("#ia-stop"); if (!q || !out) return;
  const pick = +d.p, c = q.c;
  const prompt = `Eres tutora de una médica que se prepara para el ENARM (examen mexicano de residencias). Explica esta pregunta de otra forma, en español de México, en texto plano sin Markdown y en menos de 170 palabras. Estructura: 1) la pista de la viñeta que define la respuesta, 2) una regla o imagen mental para recordarlo, 3) ${pick === 0 ? "un error frecuente que debe evitar" : "cómo distinguir la opción correcta de la que ella eligió"}. Apégate a las guías de práctica clínica mexicanas y no inventes cifras.\n\nCaso: ${c.ficha || ""}. ${c.tx}${c.v ? "\nSignos vitales: " + Object.keys(c.v).map(k => k + " " + c.v[k]).join(", ") : ""}${c.labs ? "\nLaboratorio: " + c.labs.map(l => l[0] + " " + l[1]).join(", ") : ""}\nPregunta: ${q.p.q}\nOpciones: ${q.p.ops.map(o => o[0]).join(" | ")}\nRespuesta correcta: ${q.p.ops[0][0]}\nElla eligió: ${q.p.ops[pick] ? q.p.ops[pick][0] : ""}`;
  iaAbort(); iaCtl = new AbortController(); const ctl = iaCtl;
  btn.disabled = true; out.hidden = false; out.textContent = "Pensando…"; if (stop) stop.hidden = false;
  try {
    const r = await sample(prompt, { signal: ctl.signal, onText: u => { out.textContent = u.text; } });
    out.textContent = r.text + (r.truncated ? "\n\n(La respuesta se cortó.)" : "") + "\n\nExplicación generada por IA: confírmala con la guía.";
  } catch (e) {
    const code = e && e.code; out.textContent = (e && e.text) || "";
    if (code !== "cancelled") out.textContent = (out.textContent ? out.textContent + "\n\n" : "") + iaMsg(code);
    if (!out.textContent) out.hidden = true;
  } finally { btn.disabled = false; if (stop) stop.hidden = true; if (iaCtl === ctl) iaCtl = null; }
};
ACT.genera = async (d, btn) => {
  if (!sample) return; const tema = d.id, T = TEMAS[tema], st = $("#gen-st"); if (!T) return;
  const ya = CAS.filter(c => c.tema === tema).map(c => "- " + corto(c.tx, 70)).join("\n");
  const prompt = `Eres autora de reactivos para el ENARM (examen mexicano de residencias médicas). Escribe 2 casos clínicos nuevos sobre «${T.n}» (${AREAS[T.a].n}), apegados a las Guías de Práctica Clínica y Normas Oficiales Mexicanas vigentes, en español de México. Cada caso: viñeta de 50 a 100 palabras con edad, sexo, tiempo de evolución y exploración; signos vitales y laboratorios solo si aportan; 2 preguntas (diagnóstico, estudio de elección o tratamiento) con 4 opciones y exactamente una correcta; cada opción con una explicación breve de por qué sí o por qué no. Que sean distintos de estos:\n${ya || "(ninguno)"}\n\nResponde solo con un arreglo JSON con esta forma exacta:\n[{"ficha":"Mujer · 34 años","tx":"viñeta","v":{"TA":"120/80","FC":"88","FR":"18","T":"36.8","Sat":"97%"},"labs":[["Glucosa","90 mg/dL"]],"pregs":[{"q":"pregunta","ops":[["opción correcta","por qué es correcta"],["distractor","por qué no"],["distractor","por qué no"],["distractor","por qué no"]],"perla":"regla breve para recordar"}]}]\nLa PRIMERA opción de cada pregunta es siempre la correcta (la página las revuelve). "v" y "labs" son opcionales.`;
  iaAbort(); iaCtl = new AbortController(); const ctl = iaCtl;
  btn.disabled = true; if (st) st.textContent = "Escribiendo los casos… puede tardar cerca de un minuto.";
  try {
    const data = await sample.json(prompt, { signal: ctl.signal, cache: false });
    const stamp = Date.now().toString(36);
    const nuevos = (Array.isArray(data) ? data : []).slice(0, 3).map((c, i) => {
      const str = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
      const o = { id: "g" + stamp + i, tema, ia: true, ficha: str(c && c.ficha, 80), tx: str(c && c.tx, 1400), pregs: [] };
      if (c && c.v && typeof c.v === "object") { o.v = {}; ["TA", "FC", "FR", "T", "Sat"].forEach(k => { if (typeof c.v[k] === "string" || typeof c.v[k] === "number") o.v[k] = String(c.v[k]).slice(0, 12); }); }
      if (c && Array.isArray(c.labs)) o.labs = c.labs.filter(l => Array.isArray(l) && l.length >= 2).slice(0, 8).map(l => [str(String(l[0]), 40), str(String(l[1]), 40)]);
      (c && Array.isArray(c.pregs) ? c.pregs : []).slice(0, 3).forEach(p => {
        if (!p || typeof p.q !== "string" || !Array.isArray(p.ops) || p.ops.length !== 4) return;
        const ops = p.ops.map(x => Array.isArray(x) ? [str(String(x[0] || ""), 260), str(String(x[1] || ""), 420)] : ["", ""]);
        if (ops.every(x => x[0])) o.pregs.push({ q: p.q.slice(0, 400), ops, perla: str(p.perla, 260) });
      });
      return o;
    }).filter(validCaso);
    if (!nuevos.length) throw { code: "invalid_json" };
    S.gen = nuevos.concat(S.gen).slice(0, MAX_GEN); save(); reindex();
    startRun(nuevos.map(c => c.id), { back: "tema", label: "Casos generados por IA" });
  } catch (e) {
    const code = e && e.code; if (st) st.textContent = code === "cancelled" ? "Cancelado." : iaMsg(code);
  } finally { btn.disabled = false; if (iaCtl === ctl) iaCtl = null; }
};

/* ---- sincronización del progreso con la cuenta ---- */
let dbRef = null, syncOn = false, writing = false, dirty = false, syncT = null;
function syncTxt() {
  if (syncOn) return "Tu progreso se guarda en este dispositivo y se sincroniza con tu cuenta de Claude.";
  if (!mem.ls && !mem.idb) return "Este navegador no está guardando tu avance (suele pasar en navegación privada). Ábrela en Safari normal o instálala.";
  return "<b>Guardado en " + (INSTALADA ? "la app de este teléfono" : "este navegador") + ".</b> Se guarda solo cada vez que respondes" + (mem.idb ? ", en dos copias" : "") + ". No sale de tu teléfono: si lo cambias, lleva un respaldo.";
}
function syncBadge() { const el = $("#syncst"); if (el) el.innerHTML = syncTxt(); }
function queueSync() { if (!dbRef) return; dirty = true; clearTimeout(syncT); syncT = setTimeout(pushSync, 6000); }
async function pushSync() {
  if (!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await dbRef.set({ v: 1, upd: S.upd, json: JSON.stringify(S) }); }
  catch (e) { if (e && e.code === "unavailable") dirty = true; else { dbRef = null; syncOn = false; syncBadge(); } }
  writing = false;
  if (dirty && dbRef) { clearTimeout(syncT); syncT = setTimeout(pushSync, 15000); }
}
async function initSync() {
  const [db, user] = await Promise.all([use("db"), use("user")]);
  if (!db || !user) return;
  try {
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progreso"), snap = await ref.get();
    let remoto = null;
    if (snap.exists) { const r = snap.data(); if (r && r.v === 1 && typeof r.json === "string") { try { remoto = JSON.parse(r.json); } catch (e) { remoto = null; } } }
    dbRef = ref; syncOn = true;
    if (remoto && (remoto.upd || 0) > (S.upd || 0)) { if (adopt(remoto)) { persist(); reindex(); if (!ui.run && !ui.deck && !ui.sim) render(); toast("Progreso recuperado de tu cuenta."); } }
    else if (S.upd && (!remoto || (remoto.upd || 0) < S.upd)) { dirty = true; pushSync(); }
    syncBadge();
  } catch (e) { dbRef = null; syncOn = false; }
}

/* ===== Eventos ===== */
document.addEventListener("click", e => {
  const el = e.target.closest ? e.target.closest("[data-a]") : null; if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("keydown", e => {
  const tg = e.target, tag = tg && tg.tagName; if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ui.view === "tarjetas" && ui.deck && !ui.deck.fin) {
    if (e.key === " " && tag !== "BUTTON") { e.preventDefault(); ACT.flip(); }
    else if (ui.deck.flip && ["1", "2", "3"].includes(e.key)) ACT.grade({ g: ["no", "duda", "si"][+e.key - 1] });
  } else if (ui.view === "casos" && ui.run && !ui.run.fin) {
    if (ui.run.pick === null && ["1", "2", "3", "4"].includes(e.key)) {
      const c = casoById(ui.run.ids[ui.run.ci]), perm = permDe(ui.run, c.id + "." + ui.run.qi); ACT.pick({ i: perm[+e.key - 1] });
    }
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty) { clearTimeout(syncT); pushSync(); } });

/* ===== Apariencia ===== */
function aplicaTema() {
  if (!ES_PWA) return;
  const t = S.cfg.tema, r = document.documentElement;
  if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
  try { document.querySelectorAll('meta[name="theme-color"]').forEach(m => { const oscuro = t === "dark" || (t === "auto" && /dark/.test(m.media || "")); m.setAttribute("content", oscuro ? "#22101B" : "#FFF0F6"); }); } catch (e) { /* idem */ }
}

/* ===== Arranque ===== */
load(); reindex(); aplicaTema();
(function () { const h = (location.hash || "").replace("#", ""); if (VISTAS.some(v => v[0] === h) || h === "mas" || h === "stickers") ui.view = h; })();
let diaVisto = dnum();
render();
recuperar().then(ok => { if (ok) { reindex(); aplicaTema(); if (!ui.run && !ui.deck && !ui.sim) render(); if (S.upd) toast("Recuperé tu progreso guardado."); } else syncBadge(); });
document.addEventListener("pointerdown", despierta, { once: true, passive: true });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { espejo(); return; }
  if (dnum() !== diaVisto) { diaVisto = dnum(); if (!enFoco()) render(); }   // la app quedó abierta de un día para otro
});
window.addEventListener("pagehide", espejo);
if (ES_PWA && "serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* sin modo sin conexión */ }); });
use("sample").then(s => { if (s) { sample = s; document.documentElement.classList.add("ia"); } });
initSync();

})();
</script>
